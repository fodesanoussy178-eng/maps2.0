# =============================================================================
# Synchronisation des événements canoniques
#
# Ce que fait ce travail : appeler la fonction Edge `sync-datatourisme`, qui
# lit DATAtourisme zone par zone, normalise, déduplique et range le résultat
# dans `events`. Le navigateur n'appelle jamais DATAtourisme : il lit
# `evenements_proches`, et il continue de répondre même quand le catalogue
# amont est en panne — avec des données un peu plus vieilles, ce que le
# journal `event_sync_runs` sait dire.
#
# UNE ZONE PAR TÂCHE. Même raison que pour les zones Overpass : une zone lente
# ou un catalogue qui répond en 504 ne doit pas consommer le budget des cinq
# autres. Chaque zone a sa tâche, son budget et son résultat ; celles qui
# passent sont enregistrées même si une autre échoue.
#
# Les cinq zones autonomes initiales sont déclarées explicitement dans la
# matrice ci-dessous. `event_areas` porte leurs emprises de collecte, mais ne
# peut pas élargir silencieusement le périmètre produit : toute nouvelle zone
# devra modifier le registre, la matrice, les tests et les règles de lecture.
#
# Secrets attendus dans le dépôt :
#   SUPABASE_FUNCTIONS_URL  https://<ref>.supabase.co/functions/v1
#   EVENT_SYNC_SECRET       le même que la variable d'environnement de la fonction
#
# ET RIEN D'AUTRE. GitHub ne détient AUCUNE clé Supabase — ni `service_role`,
# ni clé secrète. Il détient le droit de DÉCLENCHER une synchronisation, pas
# celui d'écrire en base : c'est la fonction qui écrit, avec la clé que la
# plateforme lui injecte et qui ne sort jamais de son processus.
#
# La différence n'est pas théorique. Un secret de dépôt qui fuit donnait
# auparavant un accès complet à la base, RLS contourné ; il ne donne plus que
# la possibilité de demander un import que la planification fait déjà.
# =============================================================================

name: Événements Autour

on:
  schedule:
    # quatre fois par jour : les agendas touristiques bougent lentement, mais
    # une annulation ou un changement d'horaire n'a de valeur que frais
    - cron: "10 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone autonome : mel, paris, angers, rennes ou rouen (vide = toutes)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # deux synchronisations simultanées écriraient les mêmes lignes et
  # fausseraient les compteurs du journal
  group: evenements-sync
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # une zone qui échoue ne doit pas annuler les autres
      fail-fast: false
      max-parallel: 2
      matrix:
        # LA MATRICE EST LA LISTE DES ZONES À TRAITER, PAS UNE CONSTANTE.
        #
        # Elle contient les cinq zones autonomes initiales. Un code saisi à la
        # main est injecté dans la matrice elle-même, jamais dans chacune des
        # tâches déjà créées.
        #
        # C'est donc la matrice elle-même qui doit changer. Un code saisi la
        # réduit à cette seule zone ; sans saisie — et c'est le cas de toute
        # exécution planifiée, où le contexte `inputs` n'existe même pas —
        # elle reste la liste complète.
        zone: ${{ fromJSON(inputs.zone && format('["{0}"]', inputs.zone) || '["mel","paris","angers","rennes","rouen"]') }}

    steps:
      - name: Synchroniser la zone ${{ matrix.zone }}
        env:
          BASE: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SYNC_SECRET: ${{ secrets.EVENT_SYNC_SECRET }}
          ZONE: ${{ matrix.zone }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SYNC_SECRET:-}" ]; then
            echo "::error::SUPABASE_FUNCTIONS_URL ou EVENT_SYNC_SECRET manquant"
            exit 1
          fi

          case "${ZONE}" in
            mel|paris|angers|rennes|rouen) ;;
            *) echo "::error::zone autonome inconnue : ${ZONE}"; exit 1 ;;
          esac

          # --fail-with-body : on veut le corps de la réponse ET un code de
          # sortie non nul. Sans lui, une erreur 502 passait pour un succès.
          # Paris conserve un seul zone_id utilisateur, mais ses cinq
          # partitions sont des invocations indépendantes : un worker ne
          # porte plus toute la capitale, et le résumé reste agrégé ici.
          if [ "${ZONE}" = "paris" ] || [ "${ZONE}" = "mel" ]; then
            if [ "${ZONE}" = "paris" ]; then
              partitions=(paris_centre paris_nord paris_est paris_sud paris_ouest)
            else
              partitions=(mel_centre_nord_ouest mel_centre_nord_est mel_centre_sud_ouest mel_centre_sud_est mel-nord mel-est mel-sud mel-ouest)
            fi
            reponses=()
            for partition in "${partitions[@]}"; do
              reponse=$(curl --silent --show-error --fail-with-body \
                --max-time 600 \
                --header "x-sync-secret: ${SYNC_SECRET}" \
                --request POST \
                "${BASE}/sync-datatourisme?area=${ZONE}&partition=${partition}") || {
                  echo "::error::synchronisation de ${ZONE}/${partition} en échec"
                  echo "${reponse:-}"
                  exit 1
                }
              if ! jq -e '.status == "success"' >/dev/null <<<"${reponse}"; then
                echo "::error::résultat non réussi pour ${ZONE}/${partition}"
                echo "${reponse}"
                exit 1
              fi
              reponses+=("${reponse}")
            done
            reponse=$(printf '%s\n' "${reponses[@]}" | jq -s --arg scope "${ZONE}" '
              {status: (if all(.[]; .status == "success") then "success" else "partial" end),
               scope: $scope, batches: length,
               vus: (map(.vus // 0) | add),
               inseres: (map(.inseres // 0) | add),
               majs: (map(.majs // 0) | add),
               fusionnes: (map(.fusionnes // 0) | add),
               rejetes: (map(.rejetes // 0) | add),
               zones: (reduce .[] as $item ({}; . * ($item.zones // {})))}')
          else
            reponse=$(curl --silent --show-error --fail-with-body \
              --max-time 600 \
              --header "x-sync-secret: ${SYNC_SECRET}" \
              --request POST \
              "${BASE}/sync-datatourisme?area=${ZONE}") || {
                echo "::error::synchronisation de ${ZONE} en échec"
                echo "${reponse:-}"
                exit 1
              }
          fi

          if ! jq -e '.status == "success"' >/dev/null <<<"${reponse}"; then
            echo "::error::résultat non réussi pour ${ZONE}"
            echo "${reponse}"
            exit 1
          fi

          echo "${reponse}"
          echo "### Zone ${ZONE}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          echo "${reponse}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
