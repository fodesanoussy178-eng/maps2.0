# ===========================================================================
# Les fonctions Edge d'Autour, et QUI a le droit de les appeler
#
# Ce fichier n'existait pas : les trois fonctions vivaient en production avec
# des réglages d'authentification qu'aucun fichier ne disait. On ne pouvait
# donc ni les relire, ni les redéployer à l'identique, ni remarquer qu'une
# d'elles avait changé de régime. Le voici.
#
# DEUX RÉGIMES, ET LA DIFFÉRENCE N'EST PAS UN DÉTAIL
#
#   · Les SYNCHRONISATIONS (`sync-*`) sont appelées par GitHub Actions, jamais
#     par un navigateur. Elles portent leur propre authentification — un secret
#     partagé vérifié dans le code, `x-sync-secret` — et désactivent donc la
#     vérification de JWT, qui ferait doublon. Ce secret est un secret de dépôt,
#     il ne sort jamais d'un serveur.
#
#   · `enrichir-lieu` est appelée DEPUIS LE NAVIGATEUR, pour un lieu que la
#     personne regarde. Elle garde `verify_jwt = true`, et l'appelant présente
#     le JWT de sa propre session Supabase — la clé publiable ne voyage qu'en
#     `apikey`, car elle ouvre la porte de l'API sans dire qui frappe. Une
#     personne non connectée ne demande donc rien : le client s'arrête avant
#     l'appel plutôt que d'abaisser la garde côté serveur. Aucun secret privé
#     ne descend dans le navigateur — et surtout pas `GEMINI_API_KEY`, qui ne
#     quitte jamais Supabase.
#
#     Lui donner à la place un `x-sync-secret` serait un recul : il faudrait
#     soit poser un secret privé dans la page — c'est-à-dire le publier — soit
#     ajouter un relais serveur qui n'apporterait rien de plus que le JWT.
#     Le vrai garde-fou d'une route publique n'est pas le jeton, c'est le
#     budget quotidien : voir ENRICHISSEMENT_BUDGET_JOUR.
# ===========================================================================

project_id = "sxnzyvcgwbwnpjnqmpkp"

# ===========================================================================
# LES E-MAILS D'AUTHENTIFICATION — UN CODE, PAS UN MOT DE PASSE
#
# Autour n'a ni mot de passe ni compte classique : pour publier un événement,
# on saisit une adresse et on reçoit un CODE À SIX CHIFFRES. Ce code, c'est
# `{{ .Token }}` dans le gabarit — la même valeur que celle vérifiée par
# `verifyOtp`. Sans `{{ .Token }}` dans le gabarit, l'e-mail arrivait sans code
# et le champ « tape le code reçu » ne pouvait rien vérifier : le seul recours
# était le lien, qui reste offert ici en second.
#
# POURQUOI TROIS GABARITS, ET PAS UN SEUL
#
# Le gabarit réellement utilisé dépend de la session au moment du geste :
#
#   · session anonyme héritée (les comptes déjà en base) → `updateUser({email})`
#     déclenche l'e-mail de CHANGEMENT d'adresse → gabarit `email_change`,
#     vérifié par `verifyOtp({ type: "email_change" })` ;
#
#   · aucune session — le cas par défaut d'un nouveau visiteur, puisque Autour
#     ne crée plus de session anonyme → `signInWithOtp` envoie, selon que
#     l'adresse a déjà un compte ou non, le `magic_link` ou la `confirmation`,
#     tous deux vérifiés par `verifyOtp({ type: "email" })`.
#
# Les trois portent donc le MÊME code et le MÊME sujet. En régler un seul
# laisserait l'autre chemin muet — exactement le genre de réglage « qu'aucun
# fichier ne disait » que ce fichier existe pour empêcher.
#
# APPLIQUER : ces gabarits sont la source de vérité, mais ils ne partent en
# production qu'avec `supabase config push` (le Dashboard ne se lit pas tout
# seul dans ce fichier). Le contenu vit dans ./templates/*.html.
# ===========================================================================

[auth.email.template.email_change]
subject = "Ton code Autour"
content_path = "./templates/email_change.html"

[auth.email.template.magic_link]
subject = "Ton code Autour"
content_path = "./templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Ton code Autour"
content_path = "./templates/confirmation.html"

# ---- Enrichissement : appelée depuis le navigateur -------------------------
[functions.enrichir-lieu]
enabled = true
verify_jwt = true
entrypoint = "./functions/enrichir-lieu/index.ts"

# ---- Synchronisations : appelées par GitHub Actions ------------------------
# `verify_jwt = false` NE VEUT PAS DIRE « sans authentification » : chacune
# vérifie `x-sync-secret` avant la moindre lecture, la moindre écriture et la
# moindre ligne de journal.
[functions.sync-datatourisme]
enabled = true
verify_jwt = false
entrypoint = "./functions/sync-datatourisme/index.ts"

[functions.sync-openagenda]
enabled = true
verify_jwt = false
entrypoint = "./functions/sync-openagenda/index.ts"
