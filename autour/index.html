          (e.sous ? '<span class="etape-sous">'+esc(e.sous)+'</span>' : '')+'</span>'+
        '<span class="etape-min">'+e.min+' min</span>'+
      '</div>').join("");
    pas.hidden = false;
  }else{
    pas.innerHTML = ""; pas.hidden = true;
  }
  rendre();                              // les autres marqueurs s'effacent
  dessinerSegments(option.segments);     // recadrage sur la totalité du parcours
}

function quitterNav(){
  if(!modeNav) return;
  modeNav = false;
  document.body.classList.remove("nav");
  $("#navBarre").hidden = true;
  $("#navEtapes").hidden = true;
  ["#navBas","#appHeader","#btnTransports","#btnCredits"]
    .forEach(s=>{ const el=$(s); if(el) el.hidden = false; });
  majFiltres(); majRaccourcis();
  ligneCouches.forEach(c=>map.removeLayer(c)); ligneCouches = [];
  $("#voile").hidden = false; $("#feuille").hidden = false;  // la fiche revient
  rendre();                                                   // et les marqueurs aussi
  majBoutons();
}

/* serveurs de démonstration publics OSRM (FOSSGIS/OpenStreetMap.de) — gratuits,
   sans clé, mais non garantis pour un usage intensif : on bascule sur une
   estimation à vol d'oiseau s'ils ne répondent pas */
const OSRM_PROFILS = {
  pied:    "https://routing.openstreetmap.de/routed-foot/route/v1/foot/",
  velo:    "https://routing.openstreetmap.de/routed-bike/route/v1/bike/",
  voiture: "https://routing.openstreetmap.de/routed-car/route/v1/driving/"
};

function tempsTrajetMinutes(distanceMetres, kmh){
  return Math.max(1, Math.round((distanceMetres/1000) / kmh * 60));
}

async function itineraireOSRM(profil, depart, arrivee){
  const base = OSRM_PROFILS[profil];
  if(!base) return null;
  try{
    const stop = new AbortController();
    const t = setTimeout(()=>stop.abort(), 6000);
    const coord = depart[1]+","+depart[0]+";"+arrivee[1]+","+arrivee[0];
    const r = await fetch(base+coord+"?overview=full&geometries=geojson", {signal:stop.signal});
    clearTimeout(t);
    if(!r.ok) return null;
    const j = await r.json();
    const route = j.routes && j.routes[0];
    if(!route || !route.geometry) return null;
    return {
      min: Math.max(1, Math.round(route.duration/60)),
      coords: route.geometry.coordinates.map(c=>[c[1],c[0]])
    };
  }catch(e){ return null; }
}

/* un segment d'itinéraire : routé réellement si OSRM répond, sinon ligne
   droite avec une estimation par vitesse moyenne (clairement indiqué à l'affichage) */
async function segmentTrajet(profil, depart, arrivee){
  const reel = await itineraireOSRM(profil, depart, arrivee);
  if(reel) return { coords:reel.coords, reel:true, min:reel.min };
  const d = distanceM(depart[0],depart[1],arrivee[0],arrivee[1]);
  return { coords:[depart,arrivee], reel:false, min: tempsTrajetMinutes(d, VITESSES_KMH[profil]||15) };
}

function dessinerSegments(segments){
  ligneCouches.forEach(c=>map.removeLayer(c));
  ligneCouches = [];
  const points = [];
  segments.forEach(seg=>{
    const c = L.polyline(seg.coords, {
      color:"#FF4A17", weight:3, opacity:.85,
      dashArray: seg.reel ? null : "4 8"
    }).addTo(map);
    ligneCouches.push(c);
    points.push(...seg.coords);
  });
  // la feuille de détail couvre le bas de l'écran : on cadre l'itinéraire
  // dans la bande encore visible, sinon le tracé est dessiné sous la feuille
  if(points.length){
    const feuille = $("#feuille");
    // en navigation la feuille est masquée : le trajet dispose de tout l'écran
    const cache = (!modeNav && feuille && !feuille.hidden)
      ? feuille.getBoundingClientRect().height : 0;
    const hauteur = map.getSize().y;
    map.fitBounds(L.latLngBounds(points), {
      paddingTopLeft:[30,30],
      paddingBottomRight:[30, Math.min(cache + 20, Math.max(hauteur - 140, 40))],
      maxZoom:16
    });
  }
}

function rendreOptions(options, iActif){
  return options.map((o,i)=>
    '<button class="'+(i===iActif?'conseille':'')+'" data-opt="'+i+'">'+
      EMOJI_MODE[o.mode]+' '+LABEL_MODE[o.mode]+' · '+o.min+' min</button>'
  ).join("");
}

async function afficherTrajet(l){
  const panneau = $("#trajet");
  if(!panneau) return;
  const dest = [l.lat, l.lng];
  // consulter un itinéraire rend les arrêts pertinents : c'est le moment où
  // savoir quel métro passe où sert vraiment
  itineraireOuvert = true;
  rendre();

  const depart = positionMoi;

  panneau.hidden = false;
  panneau.innerHTML =
    '<div class="trajet-reco" id="trajetReco"></div>'+
    '<div class="trajet-temps" id="trajetTemps"></div>'+
    '<div class="trajet-etapes" id="trajetEtapes"></div>'+
    '<p class="trajet-aide" id="trajetAide">Estimation immédiate · calcul par les rues en cours…</p>'+
    '<div id="trajetInfos"><p class="trajet-charge">Recherche des vélos et des transports…</p></div>';

  /* --- 1. Affichage instantané : estimation à vol d'oiseau, zéro attente --- */
  const dVol = distanceM(depart[0],depart[1],dest[0],dest[1]);
  const droit = (profil)=>({ coords:[depart,dest], reel:false,
    min: tempsTrajetMinutes(dVol, VITESSES_KMH[profil]||15) });

  const options = [
    { mode:"pied",    min:droit("pied").min,    segments:[droit("pied")] },
    { mode:"voiture", min:droit("voiture").min, segments:[droit("voiture")] }
  ];
  let iActif = 0, choisiParToi = false;

  const peindre = ()=>{
    const zone = $("#trajetTemps");
    if(!zone) return false;                       // feuille refermée entre-temps
    zone.innerHTML = rendreOptions(options, iActif);
    zone.querySelectorAll("[data-opt]").forEach(b=>
      b.onclick=()=>{
        iActif = Number(b.dataset.opt); choisiParToi = true;
        peindre();
        entrerNav(options[iActif], l.titre);   // plein écran, comme Plans ou Maps
      });
    // étapes détaillées : où monter, où descendre, comment finir
    const pas = $("#trajetEtapes");
    if(pas){
      const et = options[iActif].etapes;
      pas.innerHTML = et ? et.map(e=>
        '<div class="etape">'+
          '<span class="etape-ic">'+e.ic+'</span>'+
          '<span class="etape-txt">'+esc(e.txt)+
            (e.sous ? '<span class="etape-sous">'+esc(e.sous)+'</span>' : '')+'</span>'+
          '<span class="etape-min">'+e.min+' min</span>'+
        '</div>').join("") : "";
    }
    dessinerSegments(options[iActif].segments);
    return true;
  };
  /* ne réordonne le choix par défaut que tant que tu n'as rien touché toi-même */
  const rafraichir = ()=>{
    if(!choisiParToi) iActif = recommander(options);
    const ok = peindre();
    const reco = $("#trajetReco");
    if(ok && reco){
      const o = options[iActif], eco = economieCO2(o.mode, dVol);
      reco.innerHTML = '<span class="reco-titre">⭐ Recommandé</span>'+
        '<span class="reco-mode">'+EMOJI_MODE[o.mode]+' '+LABEL_MODE[o.mode]+' — '+o.min+' min</span>'+
        (eco ? '<span class="reco-co2">💚 '+eco+' g de CO₂ évités par rapport à la voiture</span>' : '');
    }
    return ok;
  };
  rafraichir();

  /* --- 2. En arrière-plan : itinéraires réellement routés par les rues --- */
  Promise.all([
    segmentTrajet("pied", depart, dest),
    segmentTrajet("voiture", depart, dest)
  ]).then(([sp,sv])=>{
    options[0] = { mode:"pied",    min:sp.min, segments:[sp] };
    options[1] = { mode:"voiture", min:sv.min, segments:[sv] };
    if(!rafraichir()) return;
    const aide = $("#trajetAide");
    if(aide) aide.textContent = (sp.reel || sv.reel)
      ? "Touche une option pour voir son trajet. Les traits pleins suivent les rues (OSRM) ; les pointillés sont une estimation à vol d’oiseau."
      : "Itinéraires routés indisponibles : les temps affichés sont estimés à vol d’oiseau.";
  });

  /* --- 3. En arrière-plan : vélos en libre-service et transports en commun --- */
  Promise.all([
    stationsVeloProchesCache(depart[0], depart[1]),
    arretsProchesCache(depart[0], depart[1]),
    arretsAvecRepli(dest[0], dest[1]),     // pour savoir à quel arrêt descendre
    // les lignes qui passent réellement à chaque bout : sans elles, on ne
    // propose aucun trajet en transport
    lignesAutour(depart[0], depart[1]),
    lignesAutour(dest[0], dest[1])
  ]).then(async ([stations, arrets, arretsArrivee, lignesDepart, lignesArrivee])=>{
    const lignesCommunes = TRANSIT.sharedLines(lignesDepart, lignesArrivee);
    const zone = $("#trajetInfos");
    if(!zone) return;

    if(stations && stations.length){
      const s = stations[0];
      const [segMarche, segVelo] = await Promise.all([
        segmentTrajet("pied", depart, [s.lat,s.lng]),
        segmentTrajet("velo", [s.lat,s.lng], dest)
      ]);
      options.push({ mode:"velo", min:segMarche.min+segVelo.min, segments:[segMarche,segVelo] });
    }

    /* Un trajet en transport n'est proposé que si une ligne dessert VRAIMENT
       les deux extrémités. Auparavant on prenait l'arrêt le plus proche de
       chaque côté, du même type, et on affirmait qu'on pouvait aller de l'un à
       l'autre : c'est ce qui faisait dire « monter à telle station, descendre
       à telle autre » entre deux points qu'aucune ligne ne relie. */
    if(arrets && arrets.length && lignesCommunes.length){
      // un choix par MODE réellement desservi, tiré des lignes communes
      const modesDesservis = [...new Set(lignesCommunes.map(x=>x.mode))];
      const parType = {}, parTypeArrivee = {};
      arrets.forEach(a=>{ if(a.type && !parType[a.type]) parType[a.type]=a; });
      (arretsArrivee||[]).forEach(a=>{ if(a.type && !parTypeArrivee[a.type]) parTypeArrivee[a.type]=a; });

      for(const type of modesDesservis){
        const monte   = parType[type];
        const descend = parTypeArrivee[type];   // où descendre, côté arrivée
        if(!monte || !descend) continue;        // pas d'arrêt de ce mode aux deux bouts
        // sans arrêt utile près du but, prendre ce mode ne rapproche de rien :
        // on exige que descendre là gagne au moins 300 m de marche
        const gain = distanceM(monte.lat,monte.lng,dest[0],dest[1]) -
                     distanceM(descend.lat,descend.lng,dest[0],dest[1]);
        if(gain < 300) continue;
        const lignes = lignesCommunes.filter(x=>x.mode === type);
        const nomLignes = lignes.slice(0,3).map(x=>x.label).join(", ");

        const [versArret, depuisArret] = await Promise.all([
          segmentTrajet("pied", depart, [monte.lat,monte.lng]),
          segmentTrajet("pied", [descend.lat,descend.lng], dest)
        ]);
        const minRoule = tempsTrajetMinutes(
          distanceM(monte.lat,monte.lng,descend.lat,descend.lng),
          VITESSE_TRANSPORT_KMH[type] || 18);
        const attente = ATTENTE_MIN[type] || 5;

        options.push({
          mode:type,
          min: versArret.min + attente + minRoule + depuisArret.min,
          lignes:nomLignes,
          etapes:[
            {ic:"🚶", txt:"Marcher jusqu’à "+monte.nom, min:versArret.min,
             sous:formatDist(monte.dist)},
            // le mode est nommé, et la ligne aussi : « Monter » sans dire quoi
            // prendre laissait deviner, et deviner était souvent faux
            {ic:EMOJI_MODE[type], txt:LABEL_MODE[type]+" "+nomLignes+" à "+monte.nom, min:attente,
             sous:"attente moyenne estimée · sens à vérifier sur place"},
            {ic:"🏁", txt:"Descendre à "+descend.nom, min:minRoule,
             sous:formatDist(distanceM(monte.lat,monte.lng,descend.lat,descend.lng))+
                  " · durée estimée, correspondances non vérifiées"},
            {ic:"🚶", txt:"Finir à pied jusqu’à "+l.titre, min:depuisArret.min,
             sous:formatDist(descend.dist)}
          ],
          segments:[
            versArret,
            {coords:[[monte.lat,monte.lng],[descend.lat,descend.lng]], reel:false},
            depuisArret
          ]
        });
      }
    }
    if(!rafraichir()) return;

    let html = "";
    if(stations && stations.length){
      html += '<p class="trajet-soustitre">Vélos en libre-service à proximité</p>'+
        stations.map(s=>
          '<div class="velo-station">'+
            '<span class="velo-nom">'+esc(s.nom)+'</span>'+
            '<span class="velo-dispo">'+s.velos+' vélo'+(s.velos>1?'s':'')+'</span>'+
            '<span class="velo-dist">'+formatDist(s.dist)+'</span>'+
          '</div>'
        ).join("");
    }
    if(arrets && arrets.length){
      html += '<p class="trajet-soustitre">Arrêts de transport à proximité</p>'+
        arrets.slice(0,5).map(a=>
          '<div class="velo-station">'+
            // sans type connu, on ne colle pas d'icône de mode : une puce
            // neutre vaut mieux qu'un pictogramme faux
            '<span class="velo-nom">'+(a.type ? EMOJI_MODE[a.type]+' ' : '📍 ')+esc(a.nom)+
              (a.type ? ' <i class="arret-mode">'+esc(LABEL_MODE[a.type])+'</i>' : '')+'</span>'+
            '<span class="velo-dist">'+formatDist(a.dist)+'</span>'+
          '</div>'
        ).join("");
      /* Dire pourquoi aucun trajet n'est proposé vaut mieux que de n'en
         proposer aucun sans explication — et infiniment mieux que d'en
         inventer un, ce que faisait la version précédente. */
      if(!lignesCommunes.length){
        html += '<p class="trajet-aide">'+
          (lignesDepart && lignesArrivee
            ? 'Aucune ligne ne dessert à la fois ces arrêts et le point d’arrivée '+
              'd’après OpenStreetMap : aucun trajet en transport n’est proposé ici.'
            : 'Lignes de transport non consultables pour le moment : aucun trajet '+
              'en transport n’est proposé plutôt qu’un trajet approximatif.')+
          '</p>';
      }
    }
    const zone2 = $("#trajetInfos");
    if(zone2) zone2.innerHTML = html ||
      '<p class="trajet-vide">Aucun vélo en libre-service ni arrêt trouvé dans un rayon d’un kilomètre.</p>';
  });
}

/* ================================================================== */
/*  Vélos en libre-service : détection auto via GBFS (partout où ça existe) */
/* ================================================================== */

let SYSTEMES_GBFS = null;

function sansAccents(s){
  return (s||"").normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase();
}

/* Lecture simple d'une ligne CSV (gère les champs entre guillemets) */
function ligneCSV(l){
  const champs = l.match(/(".*?"|[^,]*)(?=,|$)/g) || [];
  return champs.map(c=>c.replace(/^"|"$/g,"").trim());
}

async function chargerSystemesGBFS(){
  if(SYSTEMES_GBFS) return SYSTEMES_GBFS;
  try{
    const r = await fetch("https://raw.githubusercontent.com/MobilityData/gbfs/master/systems.csv");
    if(!r.ok){ SYSTEMES_GBFS = []; return SYSTEMES_GBFS; }
    const lignes = (await r.text()).split("\n").filter(Boolean);
    const entetes = ligneCSV(lignes[0]);
    const iPays = entetes.indexOf("Country Code"),
          iNom = entetes.indexOf("Name"), iLieu = entetes.indexOf("Location"),
          iUrl = entetes.indexOf("Auto-Discovery URL");
    SYSTEMES_GBFS = iUrl<0 ? [] : lignes.slice(1).map(l=>{
      const champs = ligneCSV(l);
      return { pays:(champs[iPays]||"").toUpperCase(), nom:champs[iNom]||"", lieu:champs[iLieu]||"", url:champs[iUrl]||"" };
    }).filter(s=>s.url);
  }catch(e){ SYSTEMES_GBFS = []; }
  return SYSTEMES_GBFS;
}

/* cherche un réseau GBFS dont le nom ou la localisation correspond à la commune détectée ;
   si rien ne correspond textuellement (le nom du réseau ne contient pas toujours celui
   de la ville), on élargit au pays et on vérifie avec la vraie position des stations */
async function stationsVeloProches(lat,lng){
  try{
    const systemes = await chargerSystemesGBFS();
    if(!systemes.length) return null;
    const cible = sansAccents(commune);
    let candidats = cible ? systemes.filter(s=>
      sansAccents(s.lieu).includes(cible) || sansAccents(s.nom).includes(cible)) : [];

    if(!candidats.length && paysISO){
      candidats = systemes.filter(s=>s.pays===paysISO).slice(0,20);
    }
    if(!candidats.length) return null;

    for(const sys of candidats){
      const stations = await stationsDuSysteme(sys.url, lat, lng);
      if(stations && stations.length) return stations;
    }
    return null;
  }catch(e){ return null; }
}

async function stationsDuSysteme(urlDecouverte, lat, lng){
  try{
    const r = await fetch(urlDecouverte);
    if(!r.ok) return null;
    const j = await r.json();
    const langues = j.data ? Object.keys(j.data) : [];
    if(!langues.length) return null;
    const feeds = j.data[langues[0]].feeds || [];
    const urlInfo = (feeds.find(f=>f.name==="station_information")||{}).url;
    const urlStatut = (feeds.find(f=>f.name==="station_status")||{}).url;
    if(!urlInfo || !urlStatut) return null;

    const [ri, rs] = await Promise.all([fetch(urlInfo), fetch(urlStatut)]);
    if(!ri.ok || !rs.ok) return null;
    const [ji, js] = await Promise.all([ri.json(), rs.json()]);

    const statuts = new Map((js.data.stations||[]).map(s=>[s.station_id, s]));
    return (ji.data.stations||[])
      .map(s=>{
        const st = statuts.get(s.station_id);
        const velos = st ? (st.num_bikes_available ?? st.num_vehicles_available ?? 0) : 0;
        if(!velos) return null;
        const dist = distanceM(lat, lng, s.lat, s.lon);
        if(dist > 1500) return null;
        return { nom: s.name || "Station", velos, dist, lat:s.lat, lng:s.lon };
      })
      .filter(Boolean)
      .sort((a,b)=>a.dist-b.dist)
      .slice(0,5);
  }catch(e){ return null; }
}

/* ================================================================== */
/*  Arrêts de transport en commun (métro, tram, bus) à proximité      */
/* ================================================================== */

/* Le mode d'un arrêt se lit dans les tags qui l'encodent, et nulle part
   ailleurs. L'ancienne règle rangeait en « bus » tout ce qu'elle ne
   reconnaissait pas, et en « métro » toute gare ferroviaire : d'où des arrêts
   de bus annoncés là où il n'y en a pas, et des gares SNCF présentées comme
   des stations de métro. Quand les tags ne disent rien, le type reste nul —
   l'arrêt est alors montré comme information, jamais comme un mode à prendre. */
const ETIQUETTE_ARRET = { metro:"Station de métro", tram:"Arrêt de tram",
                          bus:"Arrêt de bus", train:"Gare" };

function typeArret(t){
  const tags = t || {};
  const rail = tags.railway || "";
  if(rail === "tram_stop" || tags.tram === "yes" || tags.light_rail === "yes") return "tram";
  if(rail === "subway_entrance" || tags.station === "subway" || tags.subway === "yes") return "metro";
  if(rail === "station" || rail === "halt"){
    // une gare reste une gare : seule la présence d'un marqueur métro la
    // requalifie, et il est traité juste au-dessus
    return tags.train === "no" ? null : "train";
  }
  if(tags.highway === "bus_stop" || tags.amenity === "bus_station" || tags.bus === "yes") return "bus";
  return null;                       // on ne devine pas
}

const VITESSE_TRANSPORT_KMH = { metro:28, tram:18, bus:16, train:60, ferry:15 };
/* attente moyenne à l'arrêt, faute d'horaires temps réel accessibles partout */
const ATTENTE_MIN = { metro:4, tram:5, bus:7, train:12, ferry:12 };

async function arretsProches(lat,lng){
  try{
    // rayons larges : un métro à 1 km reste pertinent, et les arrêts sont
    // étiquetés de façons très variables selon les villes — on ratisse large
    const q = `[out:json][timeout:20];(
node(around:1500,${lat},${lng})[railway~"^(station|halt|subway_entrance)$"];
node(around:1500,${lat},${lng})[station=subway];
node(around:1500,${lat},${lng})[railway=tram_stop];
node(around:1500,${lat},${lng})[public_transport=station];
node(around:800,${lat},${lng})[highway=bus_stop];
node(around:800,${lat},${lng})[amenity=bus_station];
node(around:800,${lat},${lng})[public_transport=platform][bus=yes];
);out body 60;`;
    const els = await overpass(q, 8000);
    if(!els || !els.length) return null;
    const arrets = els.map(e=>{
      const t = e.tags||{};
      const type = typeArret(t);
      return {
        type,
        nom: t.name || (type ? ETIQUETTE_ARRET[type] : "Arrêt"),
        lat:e.lat, lng:e.lon, dist: distanceM(lat,lng,e.lat,e.lon)
      };
    }).sort((a,b)=>a.dist-b.dist);

    // une station de métro a souvent plusieurs bouches : on ne garde que la plus proche
    const vus = new Set();
    return arrets.filter(a=>{
      const cle = a.type+"|"+a.nom;
      if(vus.has(cle)) return false;
      vus.add(cle); return true;
    });
  }catch(e){ return null; }
}

/* Overpass reste injoignable sur certains réseaux, et sans lui la carte
   annonçait « aucun arrêt de transport » au milieu d'une métropole qui en est
   couverte. Google connaît ces arrêts : on lui demande quand OSM se tait. */
const TYPES_ARRET = ["bus_station","transit_station","subway_station",
                     "light_rail_station","train_station"];
/* transit_station est générique chez Google : il ne dit pas le mode. Le ranger
   en « bus » fabriquait des arrêts de bus. Sans mode connu, pas de mode. */
const ARRET_GOOGLE = {
  subway_station:"metro", train_station:"train", light_rail_station:"tram",
  bus_station:"bus", bus_stop:"bus", transit_station:null
};

async function arretsGoogle(lat,lng){
  if(!CLE_GOOGLE) return null;
  try{
    const r = await fetch("https://places.googleapis.com/v1/places:searchNearby", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "X-Goog-Api-Key":CLE_GOOGLE,
                "X-Goog-FieldMask":"places.displayName,places.location,places.primaryType" },
      body:JSON.stringify({ maxResultCount:20, includedTypes:TYPES_ARRET,
        locationRestriction:{circle:{center:{latitude:lat,longitude:lng},radius:1200}} })
    });
    if(!r.ok){ console.error("Arrêts Google : HTTP", r.status); return null; }
    const j = await r.json();
    const vus = new Set();
    return (j.places||[]).map(p=>{
      const nom = (p.displayName&&p.displayName.text) || "Arrêt";
      // « || "bus" » transformait tout type inconnu en arrêt de bus
      const type = Object.prototype.hasOwnProperty.call(ARRET_GOOGLE, p.primaryType)
        ? ARRET_GOOGLE[p.primaryType] : null;
      return { type, nom, lat:p.location.latitude, lng:p.location.longitude,
               dist: distanceM(lat,lng,p.location.latitude,p.location.longitude) };
    }).filter(a=>{
      const c = a.type+"|"+a.nom;
      if(vus.has(c)) return false; vus.add(c); return true;
    }).sort((a,b)=>a.dist-b.dist);
  }catch(e){ console.error("Arrêts Google :", e); return null; }
}

/* la position de l'utilisateur ne change pas pendant la session : on évite
   de refaire les mêmes requêtes réseau à chaque clic sur "Y aller" */
/* on ne met en cache qu'un résultat utile : si Overpass a échoué ou n'a rien
   renvoyé (panne passagère, quota), le prochain "Y aller" retentera au lieu
   de rester bloqué sur "aucun arrêt détecté" pour toute la session */
let CACHE_VELO = null, CACHE_TRANSPORT = null;
async function stationsVeloProchesCache(lat,lng){
  if(!CACHE_VELO || !CACHE_VELO.length) CACHE_VELO = await stationsVeloProches(lat,lng);
  return CACHE_VELO;
}
/* Le repli Google n'était branché que sur les arrêts de départ : ceux de
   l'arrivée restaient tributaires d'Overpass, donc aucune option métro ou bus
   n'était jamais proposée quand il ne répond pas. */
async function arretsAvecRepli(lat,lng){
  let a = await arretsProches(lat,lng);
  if(!a || !a.length) a = await arretsGoogle(lat,lng);
  return a;
}

/* ---- Quelles lignes desservent ce point ? --------------------------------
   Une ligne est une relation `type=route` dans OpenStreetMap, dont les arrêts
   sont membres. On demande les relations qui contiennent un arrêt proche : ce
   sont, réellement, les lignes qui passent là.

   C'est ce qui manquait pour arrêter d'inventer des trajets. */
const RAYON_LIGNES = 500;

async function lignesAutour(lat,lng){
  try{
    const q = `[out:json][timeout:20];(
node(around:${RAYON_LIGNES},${lat},${lng})["public_transport"~"^(stop_position|platform|station)$"];
node(around:${RAYON_LIGNES},${lat},${lng})["highway"="bus_stop"];
node(around:${RAYON_LIGNES},${lat},${lng})["railway"~"^(tram_stop|station|halt|subway_entrance)$"];
)->.arrets;
rel(bn.arrets)["type"="route"]["route"~"^(bus|tram|subway|light_rail|train|trolleybus|ferry)$"];
out tags;`;
    const els = await overpass(q, 12000);
    if(!els) return null;                 // réseau muet : on ne conclut rien
    return TRANSIT.linesFromRelations(els);
  }catch(e){ return null; }
}

async function arretsProchesCache(lat,lng){
  if(CACHE_TRANSPORT && CACHE_TRANSPORT.length) return CACHE_TRANSPORT;
  CACHE_TRANSPORT = await arretsProches(lat,lng);
  // OSM muet : on interroge Google plutôt que d'annoncer qu'il n'y a rien
  if(!CACHE_TRANSPORT || !CACHE_TRANSPORT.length){
    CACHE_TRANSPORT = await arretsGoogle(lat,lng);
    if(CACHE_TRANSPORT && CACHE_TRANSPORT.length)
      journal.info("Transports : "+CACHE_TRANSPORT.length+" arrêt(s) via Google (OSM muet)");
  }
  return CACHE_TRANSPORT;
}

/* Un lien qui ouvre vraiment le lieu chez l'autre personne, au lieu de la
   déposer sur la carte sans contexte. */
function lienVers(l){
  const u = new URL(location.href);
  u.hash = "l="+l.lat.toFixed(5)+","+l.lng.toFixed(5)+"|"+encodeURIComponent(l.titre||"");
  return u.toString();
}

function lieuPartage(){
  const m = /^#l=(-?[\d.]+),(-?[\d.]+)(?:\|(.*))?$/.exec(location.hash||"");
  if(!m) return null;
  return { lat:parseFloat(m[1]), lng:parseFloat(m[2]),
           titre: m[3] ? decodeURIComponent(m[3]) : "" };
}

/* Une fois les lieux chargés, on ouvre celui que le lien désignait. */
let partageOuvert = false;
function ouvrirLieuPartage(){
  if(partageOuvert) return;
  const p = lieuPartage();
  if(!p) return;
  const cible = lieux.find(l=>distanceM(l.lat,l.lng,p.lat,p.lng) < 60);
  if(!cible) return;                 // les lieux ne sont pas encore tous arrivés
  partageOuvert = true;
  map.flyTo([cible.lat,cible.lng], 17, {duration:.8});
  setTimeout(()=>{ pileEcrans=[]; pousserEcran(()=>ouvrirDetail(cible.id)); }, 850);
}

/* ---- Canal d'un événement ------------------------------------------------
   Annonces visibles par tous ceux qui regardent l'événement, actions
   réservées à son créateur. Rien ici ne ressemble à une conversation. */
async function chargerCanal(l){
  const bloc = $("#canalBloc");
  if(!bloc || !window.AutourEvents) return;
  const canal = await Store.canalDe(l.dbId);
  if(!canal || !document.contains(bloc)) return;
  const messages = await Store.messages(canal.id);
  if(!document.contains(bloc)) return;

  const E = window.AutourEvents;
  const decrits = messages.map(E.decrireMessage);
  const actions = E.actionsPour(canal, moiId);

  bloc.innerHTML =
    (decrits.length
      ? '<p class="fb-section">Mises à jour</p>'+
        decrits.map(m=>'<div class="an-msg'+(m.urgent?' urgent':'')+(m.systeme?' systeme':'')+'">'+
          '<span class="an-tag">'+esc(m.etiquette)+'</span>'+
          '<span class="an-corps">'+esc(m.corps)+'</span></div>').join("")
      : "")+
    (actions.length
      ? '<p class="fb-section">Prévenir les participants</p><div class="an-actions">'+
        actions.map(a=>'<button class="an-act'+(a.danger?' danger':'')+'" data-act="'+a.id+'">'+
          esc(a.label)+'</button>').join("")+'</div>'
      : (canal.admin !== moiId
        ? '<button class="an-suivre" data-suivre="1">Être prévenu des changements</button>' : ""));

  bloc.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>actionCreateur(b.dataset.act, l, canal));
  const suivre = bloc.querySelector("[data-suivre]");
  if(suivre) suivre.onclick=async()=>{
    if(await Store.rejoindre(canal.id, "suiveur")){
      toast("Tu seras prévenu des changements");
      await rafraichirCanaux();
      chargerCanal(l);
    }
  };
}

/* Les six actions. Aucune n'écrit de message système : elles modifient
   l'événement, et la base produit l'annonce — un changement ne peut donc
   pas passer silencieusement. */
async function actionCreateur(id, l, canal){
  const E = window.AutourEvents;
  if(id === "annonce" || id === "retard"){
    const texte = id === "retard"
      ? E.texteRetard(prompt("Retard estimé, en minutes ?"))
      : (prompt("Annonce courte à envoyer aux participants :") || "").trim();
    if(!texte){ if(id === "retard") toast("Retard non compris"); return; }
    toast(await Store.annoncer(canal.id, texte) ? "Annonce envoyée" : "Envoi impossible");
    return chargerCanal(l);
  }
  if(id === "horaire"){
    const saisie = prompt("Nouvel horaire (JJ/MM/AAAA HH:MM) :");
    const quand = saisie && saisie.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})$/);
    if(!quand){ if(saisie) toast("Format attendu : 12/09/2026 20:30"); return; }
    const iso = new Date(+quand[3], +quand[2]-1, +quand[1], +quand[4], +quand[5]).toISOString();
    toast(await Store.modifierEvenement(l.dbId,{debut_le:iso}) ? "Horaire mis à jour" : "Modification impossible");
    return chargerCanal(l);
  }
  if(id === "lieu"){
    const adresse = (prompt("Nouveau lieu :", l.adresse || "") || "").trim();
    if(!adresse) return;
    toast(await Store.modifierEvenement(l.dbId,{adresse}) ? "Lieu mis à jour" : "Modification impossible");
    return chargerCanal(l);
  }
  if(id === "places"){
    const places = parseInt(prompt("Places restantes :"), 10);
    if(!Number.isFinite(places) || places < 0) return;
    toast(await Store.modifierEvenement(l.dbId,{places}) ? "Places mises à jour" : "Modification impossible");
    return chargerCanal(l);
  }
  if(id === "annulation"){
    // un événement annulé reste affiché : le masquer ferait venir les gens
    if(!confirm("Annuler l’événement ? Les participants seront prévenus.")) return;
    toast(await Store.modifierEvenement(l.dbId,{annule:true}) ? "Événement annulé" : "Annulation impossible");
    return chargerCanal(l);
  }
}

/* ---------- dates ---------- */
function aujourdHui(){ const d=new Date(); d.setMinutes(0,0,0); return d; }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function prochaineHeure(){
  const d=new Date(); d.setMinutes(0,0,0); d.setHours(d.getHours()+1);
  return String(d.getHours()).padStart(2,"0")+":00";
}
function prochainSamedi(){
  const d=aujourdHui(); const j=d.getDay();
  d.setDate(d.getDate() + ((6-j)+7)%7 || 7);
  return d;
}
function libelleQuand(b){
  if(!b.date) return "";
  const [a,m,j] = b.date.split("-").map(Number);
  const d = new Date(a, m-1, j);
  const jour = new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"}).format(d);
  const h = b.heure ? " · " + b.heure.replace(":","h") : "";
  const f = (b.heure && b.fin) ? " → " + b.fin.replace(":","h") : "";
  return jour.charAt(0).toUpperCase()+jour.slice(1) + h + f;
}

/* Décode n'importe quel format que le navigateur sait lire — HEIC compris sur
   iOS —, applique l'orientation EXIF, borne le grand côté et réencode en JPEG.
   Rend null si le décodage échoue : on retombe alors sur le fichier d'origine
   plutôt que de bloquer la publication. */
const IMAGE_COTE_MAX = 1600;
async function preparerImage(fichier){
  if(!fichier || !/^image\//.test(fichier.type || "")) return null;
  try{
    const bitmap = await createImageBitmap(fichier, {imageOrientation:"from-image"});
    const ratio = Math.min(1, IMAGE_COTE_MAX / Math.max(bitmap.width, bitmap.height));
    const largeur = Math.max(1, Math.round(bitmap.width * ratio));
    const hauteur = Math.max(1, Math.round(bitmap.height * ratio));
    const toile = document.createElement("canvas");
    toile.width = largeur; toile.height = hauteur;
    toile.getContext("2d").drawImage(bitmap, 0, 0, largeur, hauteur);
    if(bitmap.close) bitmap.close();
    const blob = await new Promise(r=>toile.toBlob(r, "image/jpeg", .82));
    if(!blob) return null;
    return new File([blob], "affiche.jpg", {type:"image/jpeg", lastModified:Date.now()});
  }catch(e){
    return null;   // format illisible : on laisse le fichier d'origine tenter sa chance
  }
}

/* Lieux permanents proches où rien n'est encore prévu aujourd'hui : proposer
   une adresse qui existe déjà évite les événements posés au milieu de nulle part. */
function lieuxLibres(){
  const [lat,lng] = positionMoi;
  return lieux
    .filter(l=>!estTemporaire(l))
    .filter(l=>!indexEvenements.get(l.titre))
    .map(l=>Object.assign({}, l, {dist:distanceM(lat,lng,l.lat,l.lng)}))
    .sort((a,b)=>a.dist-b.dist)
    .slice(0,15);
}

async function chercherAdresse(q){
  try{
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=6&q="+
      encodeURIComponent(q));
    if(!r.ok) return [];
    return (await r.json()).map(a=>({
      nom:a.display_name, lat:parseFloat(a.lat), lng:parseFloat(a.lon)
    }));
  }catch(e){ console.error("Recherche d’adresse :", e); return []; }
}

  const l=normaliserItem({ id:"n"+Date.now(), cat:b.cat,
    titre:(b.titre||"").trim()||"Sans titre",

  // l'affiche part avant la fiche : sans URL, la publication se ferait sans image
  if(b.imageFichier) l.image = await Store.televerserImage(b.imageFichier);

/* Pour afficher de vraies notes, il faut l'API Places de Google :
   une clé + un compte de facturation. Colle-la ici et les notes
   apparaîtront automatiquement dans les listes. Laissée vide, l'app
   classe par distance — ce qui est honnête et déjà utile. */
const CLE_GOOGLE = "AIzaSyAFjDL4NtNNaTFhD-tbN4escj8xQ9Mpio4";

const TYPES_RESTO = ["restaurant","cafe","bar","bakery","meal_takeaway"];

/* Les notes mesurent la satisfaction, pas le prix. Pour « ce qui coûte le
   moins cher », le seul signal honnête est priceLevel, que Google calcule à
   partir des tarifs constatés — on ne le déduit pas des commentaires. */
const NIVEAU_PRIX = {
  PRICE_LEVEL_FREE:0, PRICE_LEVEL_INEXPENSIVE:1, PRICE_LEVEL_MODERATE:2,
  PRICE_LEVEL_EXPENSIVE:3, PRICE_LEVEL_VERY_EXPENSIVE:4
};
const SYMBOLE_PRIX = ["Gratuit","€","€€","€€€","€€€€"];
/* catégories où parler de prix a un sens */
const AVEC_PRIX = new Set(["resto","fastfood","cafe","bar","commerce","friperie","marche"]);

/* types Google → catégories de l'app, pour les lieux absents d'OpenStreetMap */
const CAT_GOOGLE = {
  restaurant:"resto", pizza_restaurant:"resto", meal_delivery:"resto",
  fast_food_restaurant:"fastfood", meal_takeaway:"fastfood", hamburger_restaurant:"fastfood",
  cafe:"cafe", bakery:"cafe", coffee_shop:"cafe",
  bar:"bar", pub:"bar", night_club:"concert",
  movie_theater:"cinema", performing_arts_theater:"spectacle",
  library:"biblio", museum:"musee", art_gallery:"musee", park:"parc",
  coworking_space:"coworking",
  hospital:"sante", pharmacy:"sante", doctor:"sante", drugstore:"sante",
  local_government_office:"mairie", city_hall:"mairie", post_office:"mairie",
  government_office:"emploi", employment_agency:"emploi",
  association_or_organization:"asso", non_profit_organization:"asso",
  social_services_organization:"asso", welfare_organization:"asso",
  school:"ecole", university:"ecole", primary_school:"ecole", secondary_school:"ecole",
  library:"biblio", tourist_attraction:"musee",
  // un supermarché est un commerce, jamais de l'aide alimentaire : confondre
  // les deux enverrait quelqu'un qui cherche à manger vers une caisse
  supermarket:"commerce", grocery_store:"commerce", convenience_store:"commerce",
  clothing_store:"friperie", thrift_store:"friperie", store:"commerce"
};

/* URL média d'une photo de lieu. Hauteur bornée : une carte de 88 px n'a
   pas besoin d'un original de 4000 px sur un réseau mobile. */
function photoGoogle(p){
  const photo = (p.photos || [])[0];
  if(!photo || !photo.name) return "";
  return "https://places.googleapis.com/v1/"+photo.name+
    "/media?maxHeightPx=400&skipHttpRedirect=false&key="+CLE_GOOGLE;
}

function mapperPlace(p){
  return {
    nom:(p.displayName&&p.displayName.text)||"",
    lat:p.location.latitude, lng:p.location.longitude,
    note:p.rating, avis:p.userRatingCount,
    ouvert: p.currentOpeningHours ? p.currentOpeningHours.openNow : undefined,
    prixN: NIVEAU_PRIX[p.priceLevel],
    cuisine: /_restaurant$/.test(p.primaryType||"")
      ? (p.primaryType||"").replace(/_restaurant$/,"") : "",
    horaires: (p.regularOpeningHours||{}).weekdayDescriptions || null,
    tel: p.nationalPhoneNumber || "",
    pmr: (p.accessibilityOptions||{}).wheelchairAccessibleEntrance,
    type: p.primaryType || "", adresse: p.formattedAddress || "",
    image: photoGoogle(p)
  };
}

/* Une application de découverte doit donner envie avant de faire lire :
   sans places.photos, toutes les cartes retombaient sur un emoji. */
const CHAMPS_PLACE = "places.displayName,places.location,places.rating,"+
  "places.photos,"+
  "places.userRatingCount,places.currentOpeningHours.openNow,"+
  "places.primaryType,places.formattedAddress,places.priceLevel,"+
  "places.regularOpeningHours.weekdayDescriptions,places.nationalPhoneNumber,"+
  "places.accessibilityOptions.wheelchairAccessibleEntrance";

/* Recherche libre chez Google. OpenStreetMap ignore beaucoup d'équipements
   publics (une mission locale y est rarement cartographiée) alors que Google
   sait où ils sont : on l'interroge quand notre propre base ne suffit pas. */
async function chercherGoogle(q, lat, lng){
  if(!CLE_GOOGLE) return [];
  try{
    const r = await fetch("https://places.googleapis.com/v1/places:searchText", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-Goog-Api-Key":CLE_GOOGLE,
        "X-Goog-FieldMask":CHAMPS_PLACE
      },
      body:JSON.stringify({
        textQuery:q, languageCode:"fr", maxResultCount:12,
        locationBias:{circle:{center:{latitude:lat,longitude:lng},radius:6000}}
      })
    });
    if(!r.ok){ console.error("Recherche Google: HTTP", r.status, await r.text()); return []; }
    const j = await r.json();
    journal.info("Recherche Google «"+q+"» :", (j.places||[]).length, "résultat(s)");
    return (j.places||[]).map(mapperPlace);
  }catch(e){ console.error("Recherche Google:", e); return []; }
}

async function placesGoogle(lat, lng, types, signal){
  const corps = {
    maxResultCount:20,
    locationRestriction:{circle:{center:{latitude:lat,longitude:lng},radius:1500}}
  };
  if(types) corps.includedTypes = types;
  const r = await fetch("https://places.googleapis.com/v1/places:searchNearby", {
    method:"POST", signal,
    headers:{
      "Content-Type":"application/json",
      "X-Goog-Api-Key":CLE_GOOGLE,
      "X-Goog-FieldMask":CHAMPS_PLACE
    },
    body:JSON.stringify(corps)
  });
  if(!r.ok){ console.error("Google Places: réponse HTTP", r.status, await r.text()); return []; }
  const j = await r.json();
  return (j.places||[]).map(mapperPlace);
}

/* Une requête généraliste suffit à l'ouverture. La passe ciblée restauration
   coûtait une seconde requête facturée à chaque zone alors que personne
   n'avait encore demandé à manger : elle part maintenant quand on ouvre
   « Manger », et pas avant. */
async function notesGoogle(lat, lng, opts){
  if(!CLE_GOOGLE) return null;
  const o = opts || {};
  try{
    const listes = [placesGoogle(lat, lng, null, o.signal)];
    if(o.resto) listes.push(placesGoogle(lat, lng, TYPES_RESTO, o.signal));
    const recus = await Promise.all(listes);
    const uniques = new Map();
    recus.flat().forEach(f=>{ if(f.nom) uniques.set(f.nom+"|"+f.lat.toFixed(4), f); });
    const fiches = [...uniques.values()];
    journal.info("Google Places :", fiches.length, "fiche(s) reçue(s)");
    return fiches;
  }catch(e){
    if(e && e.name === "AbortError") return null;
    console.error("notesGoogle: échec de la requête", e); return null;
  }
}

/* Complément restauration, déclenché seulement quand le besoin « Manger »
   s'ouvre. Une fois par zone : on ne repaie pas à chaque aller-retour. */
const zonesResto = new Set();
function completerRestauration(){
  if(!positionMoi || !CLE_GOOGLE) return;
  const [lat,lng] = positionMoi;
  const cle = lat.toFixed(2)+","+lng.toFixed(2);
  if(zonesResto.has(cle)) return;
  zonesResto.add(cle);
  placesGoogle(lat, lng, TYPES_RESTO)
    .then(f=>{ if(f && f.length){ greffeNotes(lieux, f); ajouterLieuxGoogle(f); majAccueil(); } })
    .catch(()=>{});
}

/* Les commerces connus de Google mais absents d'OpenStreetMap : sans eux, la
   liste des restos serait amputée de tout ce qui n'est pas cartographié. */
function ajouterLieuxGoogle(fiches, catDefaut){
  if(!fiches) return 0;
  const aAjouter = [];
  fiches.forEach(f=>{
    if(!f.nom) return;
    // le nom tranche mieux que le type : Google range la Mission locale en
    // « organisation à but non lucratif », ce qui la noierait dans les assos
    const service = preciserService(f.nom);
    let cat = affinerCategorie(CAT_GOOGLE[f.type] || f.autourCat || catDefaut, f.nom);
    if(/Mission locale|France Travail|Cap emploi|Maison de l’emploi/.test(service)) cat = "emploi";
    else if(!cat && service) cat = "asso";
    if(!cat) return;
    const deja = lieux.some(l=>
      distanceM(l.lat,l.lng,f.lat,f.lng) < 80 &&
      sansAccents(l.titre) === sansAccents(f.nom));
    if(deja) return;
    aAjouter.push(normaliserItem({
      id:"g"+hash(f.nom+f.lat), cat, titre:f.nom,
      description:f.description || "", type:f.type,
      adresse:f.adresse || f.nom, cp:commune,
      quand:"Voir sur place", gratuit:true, prix:0,
      places:null, qr:false, par:"Google Maps",
      lat:f.lat, lng:f.lng, note:f.note, avis:f.avis, ouvert:f.ouvert,
      prixN:f.prixN, cuisine:f.cuisine, service, horaires:f.horaires,
      // un lieu ramené par une recherche de réseau d'aide l'est par construction
      solidaire: f.solidaire === true || estSolidaire(f.nom, false),
      tel:f.tel, pmr:f.pmr
    }, "google_places"));
  });
  const ajoutes = aAjouter.length;
  if(ajoutes) fusionner(aAjouter, "permanent");
  if(ajoutes) journal.info("Google Places :", ajoutes, "lieu(x) ajouté(s)");
  return ajoutes;
}

/* rapproche chaque lieu OSM de la fiche Google la plus proche (< 150 m) */
function greffeNotes(liste, fiches){
  if(!fiches) return;
  liste.forEach(l=>{
    let meilleur=null, dMin=150;
    const nomL = sansAccents(l.titre);
    fiches.forEach(f=>{
      const d = distanceM(l.lat,l.lng,f.lat,f.lng);
      if(d > 400) return;
      // un nom qui correspond l'emporte sur la simple proximité : deux
      // restaurants mitoyens ne doivent pas hériter de la note l'un de l'autre
      const nomF = sansAccents(f.nom);
      const memeNom = nomL && nomF && (nomL.includes(nomF) || nomF.includes(nomL));
      const score = memeNom ? d/4 : d;
      if(score < dMin){ dMin = score; meilleur = f; }
    });
    if(meilleur){
      l.note = meilleur.note; l.avis = meilleur.avis;
      l.ouvert = meilleur.ouvert;                       // ouvert / fermé maintenant
      if(meilleur.prixN != null) l.prixN = meilleur.prixN;
      if(meilleur.horaires) l.horaires = meilleur.horaires;
      if(meilleur.tel) l.tel = meilleur.tel;
      if(meilleur.pmr != null) l.pmr = meilleur.pmr;
      // la photo ne remplace jamais celle d'un événement déjà illustré
      if(meilleur.image && !l.image) l.image = meilleur.image;
    }
  });
  rendre();                     // les pastilles reflètent aussitôt les nouvelles infos
}

function distanceM(lat1,lng1,lat2,lng2){
  const R=6371000, r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLng=(lng2-lng1)*r;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
const formatDist = (m)=> m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1)+" km";

/* événements éphémères qui se passent dans un lieu donné */
function evenementsDe(lieu){
  return lieux.filter(l=>estTemporaire(l) && l.adresse === lieu.titre);
}

/* "auto" = pertinence · "note" = les mieux notés · "distance" = les plus proches */
let triListe = "auto";

function classerLieux(liste, sansPalmares){
  const [lat,lng] = positionMoi;
  const dedans = liste.map(l=>{
    const d = distanceM(lat,lng,l.lat,l.lng);
    const evs = estTemporaire(l) ? [] : evenementsDe(l);
    return Object.assign({}, l, {dist:d, evs:evs.length, mien:!!l.mien});
  });

  dedans.sort((a,b)=>{
    // une banque alimentaire ou un foyer ne se classe pas : le plus proche d'abord
    if(sansPalmares) return a.dist - b.dist;
    if(triListe === "distance") return a.dist - b.dist;
    if(triListe === "prix"){
      // le moins cher d'abord, et à prix égal le mieux noté : le but est de
      // trouver ce qui fait économiser sans tomber sur ce que personne n'aime
      const pa = a.prixN==null ? 9 : a.prixN, pb = b.prixN==null ? 9 : b.prixN;
      if(pa !== pb) return pa - pb;
      const na = a.note||0, nb = b.note||0;
      if(na !== nb) return nb - na;
      return a.dist - b.dist;
    }
    if(triListe === "note"){
      // le nombre d'avis départage : 4,8 sur 6 avis pèse moins que 4,6 sur 800
      const na=a.note||0, nb=b.note||0;
      if(na !== nb) return nb - na;
      const va=a.avis||0, vb=b.avis||0;
      if(va !== vb) return vb - va;
      return a.dist - b.dist;
    }
    if(a.mien !== b.mien) return a.mien ? -1 : 1;          // tes ajouts d'abord
    if(a.note && b.note && a.note !== b.note) return b.note - a.note;  // note si dispo
    if(a.evs !== b.evs) return b.evs - a.evs;              // là où il se passe un truc
    return a.dist - b.dist;                                // sinon, le plus proche
  });
  return dedans;
}

function classer(cat){
  return classerLieux(lieux.filter(l=>correspondCategorie(l,cat)), SANS_CLASSEMENT.has(cat));
}

function ouvrirListe(cat){
  const c = CATS[cat]; if(!c) return;
  mettreAJourProfil("categorie", cat);
  // l'aide n'est cherchée que si quelqu'un la demande : dix recherches
  // facturées à chaque ouverture de l'app seraient absurdes
  if(SANS_CLASSEMENT.has(cat) && positionMoi)
    chargerAide(positionMoi[0], positionMoi[1]).then(()=>{
      if(filtreActif === cat) ouvrirListe(cat);
    });
  afficherListe(c.emoji, c.label, classer(cat), SANS_CLASSEMENT.has(cat),
                ()=>ouvrirListe(cat));
}

/* Une seule mise en page pour les listes d'une catégorie et les résultats de
   recherche. `sansPalmares` masque le tri et les notes (lieux d'aide). */
function afficherListe(emoji, titre, l, sansPalmares, redessiner){
  const avecNotes = l.some(x=>x.note);
  const avecPrix  = l.some(x=>x.prixN != null);
  const critere = sansPalmares
    ? "Trié par distance. Ces lieux ne sont pas classés : ils rendent tous le même service."
    : triListe === "prix"
      ? (avecPrix ? "Du moins cher au plus cher, à prix égal le mieux noté. Le niveau de prix vient de Google, pas des commentaires."
                  : "Aucun niveau de prix connu ici : l’ordre retombe sur la distance.")
    : triListe === "distance" ? "Du plus proche au plus loin."
    : triListe === "note"
      ? (avecNotes ? "Les mieux notés d’abord, à note égale le plus commenté."
                   : "Aucune note disponible ici : l’ordre retombe sur la distance.")
      : (avecNotes ? "Classé par note, puis par ce qui s’y passe, puis par distance."
                   : "Classé par ce qui s’y passe, puis par distance.");

  const tris = [["auto","Pertinence"],["note","Mieux notés"],["distance","Plus proches"]];
  // « Moins cher » n'apparaît que là où le prix veut dire quelque chose
  if(avecPrix || l.some(x=>AVEC_PRIX.has(x.cat))) tris.push(["prix","Moins cher"]);
  const barreTri = sansPalmares ? "" : '<div class="tri-barre">'+
    tris.map(([id,lab])=>'<button class="tri'+(triListe===id?" actif":"")+'" data-tri="'+id+'">'+lab+'</button>')
      .join("")+
    '</div>';

  const lignes = l.map((x,i)=>{
    const c = CATS[x.cat] || {emoji:"📍"};
    const sous = [];
    if(x.note && !sansPalmares) sous.push('<span class="rang-note">★ '+x.note.toFixed(1)+
      (x.avis?' <span style="font-weight:500;color:var(--ink2)">('+x.avis+')</span>':'')+'</span>');
    const badge = badgeDispo(x);
    if(badge) sous.push(badge);
    if(x.cuisine) sous.push(esc(x.cuisine.replace(/[_;]/g," ")));
    if(x.prixN != null) sous.push('<span class="prix-n">'+SYMBOLE_PRIX[x.prixN]+'</span>');
    if(x.service) sous.push('<span class="service">'+esc(x.service)+'</span>');
    sous.push(esc(x.adresse||""));
    // horaires réels quand OpenStreetMap les connaît
    sous.push(esc(libelleHoraires(x)));
    return '<button class="rang" data-va="'+esc(x.id)+'">'+
      '<span class="rang-n">'+(i+1)+'</span>'+
      '<span class="rang-emoji">'+c.emoji+'</span>'+
      '<span class="rang-txt"><span class="rang-nom">'+esc(x.titre)+
        (x.mien?'<span class="badge mien">Ton ajout</span>':'')+
        (x.evs?'<span class="badge">'+x.evs+' ce soir</span>':'')+'</span>'+
      '<span class="rang-sous">'+sous.join(" · ")+'</span></span>'+
      '<span class="rang-dist">'+formatDist(x.dist)+'</span></button>';
  }).join("");

  ouvrirFeuille(
    '<div class="liste-tete"><h2>'+emoji+' '+esc(titre)+'</h2>'+
    '<span class="liste-compte">'+l.length+' autour</span></div>'+
    barreTri+
    '<p class="liste-tri">'+critere+'</p>'+
    (l.length ? lignes : '<p class="liste-vide">Rien de ce type dans le coin.<br>Tu peux en poser un avec le bouton +.</p>')
  );

  $("#feuille").querySelectorAll("[data-tri]").forEach(b=>b.onclick=()=>{
    triListe = b.dataset.tri;
    redessiner();          // même écran, nouvel ordre : on n'empile pas de retour
  });

  $("#feuille").querySelectorAll("[data-va]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.va, cible = lieux.find(x=>x.id===id);
    if(!cible) return;
    map.flyTo([cible.lat,cible.lng], Math.max(map.getZoom(),17), {duration:.7});
    pousserEcran(()=>ouvrirDetail(id));   // le retour ramène à la liste
  });
}

/* Recherche libre : « bar » ouvre le classement des bars, « chez Momo »
   cherche par nom. Dans les deux cas on retombe sur la même liste classée. */
function ouvrirResultats(q){
  // « restaurant turc », « africain », « sushi » : la cuisine passe avant la
  // catégorie, sinon « restaurant turc » ouvrirait juste tous les restaurants
  const cuisine = cuisineRecherchee(q);
  if(cuisine){
    const trouves = lieux.filter(l=>{
      const c = sansAccents(l.cuisine||"");
      return c && (c.includes(cuisine) || cuisine.includes(c));
    });
    if(trouves.length){
      pileEcrans = [];
      pousserEcran(()=>afficherListe("🍽", "« "+q+" »",
        classerLieux(trouves, false), false, ()=>ouvrirResultats(q)));
      return;
    }
  }
  const cat = categorieRecherchee(q);
  if(cat){
    filtreActif = cat; dessinerFiltres(); rendre();
    if(SANS_CLASSEMENT.has(cat) && positionMoi) chargerAide(positionMoi[0], positionMoi[1]);
    pileEcrans = [];
    pousserEcran(()=>ouvrirListe(cat));
    // OSM ignore beaucoup d'équipements publics : on demande à Google et on
    // complète la liste sans faire attendre devant un écran vide
    completerParGoogle(q, cat, ()=>ouvrirListe(cat));
    return;
  }
  const t = sansAccents(q);
  const trouves = lieux.filter(l=>
    sansAccents(l.titre+" "+(l.adresse||"")+" "+(l.cuisine||"")).includes(t));
  const montrer = ()=>{
    const encore = lieux.filter(l=>
      sansAccents(l.titre+" "+(l.adresse||"")+" "+(l.cuisine||"")).includes(t));
    afficherListe("🔎", "« "+q+" »", classerLieux(encore, false), false,
                  ()=>ouvrirResultats(q));
  };
  pileEcrans = [];
  pousserEcran(montrer);
  completerParGoogle(q, null, montrer);
}

/* OpenStreetMap cartographie très mal l'aide alimentaire, et les portails
   open data ne couvrent pas toutes les métropoles. Chercher les réseaux par
   leur nom donne des adresses et surtout des HORAIRES DE DISTRIBUTION réels,
   qui sont l'information vitale ici : « mardi 14h-16h » vaut mieux que
   l'existence d'un point sur une carte. */
const RESEAUX_AIDE = [
  { q:"Restos du Cœur",             cat:"alimentaire" },
  { q:"Banque Alimentaire",         cat:"alimentaire" },
  { q:"épicerie solidaire",         cat:"alimentaire" },
  { q:"distribution alimentaire",   cat:"alimentaire" },
  { q:"Secours Populaire",          cat:"alimentaire" },
  { q:"Secours Catholique",         cat:"asso" },
  { q:"Croix-Rouge",                cat:"asso" },
  { q:"CCAS action sociale",        cat:"emploi" },
  { q:"accueil de jour sans-abri",  cat:"hebergement" },
  { q:"hébergement d'urgence",      cat:"hebergement" },
  // accès aux droits et insertion : trois guichets distincts qu'OSM range
  // sous le même tag, et qui ne reçoivent pas les mêmes personnes
  { q:"Mission locale",             cat:"emploi" },
  { q:"France Travail",             cat:"emploi" },
  { q:"France Services accès aux droits", cat:"emploi" },
  { q:"vestiaire solidaire vêtements", cat:"friperie" },
  { q:"bains-douches municipaux",   cat:"toilettes" },
];

/* Ces adresses ne bougent quasiment jamais : on les garde une semaine plutôt
   que de relancer dix recherches facturées à chaque ouverture de l'app. */
const cleAide = (lat,lng)=>"autour:aide:"+lat.toFixed(2)+","+lng.toFixed(2);
/* Où l'aide a déjà été cherchée. Un simple booléen suffisait tant qu'on
   restait chez soi : dès qu'on regardait une autre commune, plus rien
   n'était chargé et l'écran d'aide restait celui du point de départ. On
   recharge donc quand la zone regardée s'éloigne assez pour que les points
   trouvés ne la concernent plus. */
let aideChargeeAutour = null;
const AIDE_RAYON_RECHARGE = 5000;
let aideEnCours = false;      // pour distinguer « on cherche » de « rien trouvé »

async function chargerAide(lat,lng){
  if(aideChargeeAutour &&
     distanceM(aideChargeeAutour[0], aideChargeeAutour[1], lat, lng) < AIDE_RAYON_RECHARGE) return;
  aideChargeeAutour = [lat,lng];
  aideEnCours = true;
  definirEtatRecherche("places",SEARCH_STATES.LOADING_PLACES);
  // Laisse la feuille s'afficher avant de normaliser un éventuel cache.
  // Le double passage rAF → tâche garantit au navigateur un premier paint.
  await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,0)));
  try{ await chargerAideVraiment(lat,lng); }
  finally{
    aideEnCours = false;
    const trouve = lieux.some(l=>correspondUneCategorie(l,SET_AIDE));
    definirEtatRecherche("places",trouve ? SEARCH_STATES.SUCCESS : SEARCH_STATES.EMPTY);
  }
}

async function chargerAideVraiment(lat,lng){

  try{
    const brut = localStorage.getItem(cleAide(lat,lng));
    if(brut){
      const o = JSON.parse(brut);
      if(Date.now() - o.t < 7*24*3600*1000){
        // Un seul pipeline de fusion/rendu pour tout le cache. Auparavant,
        // chaque adresse reconstruisait tous les marqueurs et bloquait le clic.
        const fiches = o.l.map(x=>Object.assign({},x.f,{autourCat:x.cat}));
        ajouterLieuxGoogle(fiches);
        return;
      }
    }
  }catch(e){}

  charge("Recherche des points d’aide…");
  const garder = [];
  await Promise.all(RESEAUX_AIDE.map(async r=>{
    const res = await chercherGoogle(r.q, lat, lng);
    res.forEach(f=>{
      // on écarte ce qui est trop loin : une distribution à 20 km n'aide personne
      if(distanceM(lat,lng,f.lat,f.lng) > 15000) return;
      f.solidaire = true;              // trouvé en cherchant un réseau d'aide
      garder.push({f, cat:r.cat});
      ajouterLieuxGoogle([f], r.cat);
    });
  }));
  charge(null);

  try{ localStorage.setItem(cleAide(lat,lng), JSON.stringify({t:Date.now(), l:garder})); }
  catch(e){}
  journal.info("Aide sociale :", garder.length, "point(s) trouvé(s)");
  majAccueil();
}

/* « restaurant à Lille » depuis Roubaix : on détecte la ville visée, on s'y
   déplace et on classe les résultats de là-bas. Sans ça, la recherche restait
   collée à la position courante. */
function villeRecherchee(q){
  // \b ne marche pas devant « à » : le caractère accentué n'est pas un mot ASCII
  const m = /(?:^|\s)(?:a|à|sur|vers|dans)\s+([A-Za-zÀ-ÿ][\wÀ-ÿ'’-]{2,}(?:[ -][A-Za-zÀ-ÿ][\wÀ-ÿ'’-]+){0,3})\s*$/.exec(q.trim());
  return m ? m[1].trim() : null;
}

/* Géocodage générique — aucune ville n'est connue d'avance.
   Deux raisons de ne plus se contenter du premier résultat :
     · les homonymes. « Roubaix » existe ailleurs qu'en France ; à importance
       comparable, on préfère le plus proche de l'endroit regardé, ce qui ne
       privilégie aucun pays mais suit l'utilisateur ;
     · l'étendue. Nominatim renvoie une emprise : s'en servir évite d'afficher
       un arrondissement quand on a demandé Paris, ou trois départements quand
       on a demandé un quartier. Un zoom fixe ne peut pas convenir aux deux. */
const ECART_IMPORTANCE = 0.15;   // en deçà, deux résultats se valent

async function geocoderVille(nom, pres){
  try{
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2"+
      "&limit=5&addressdetails=0&q="+encodeURIComponent(nom),
      {headers:{"Accept-Language":"fr"}});
    if(!r.ok) return null;
    const j = await r.json();
    if(!j.length) return null;

    const depuis = pres || positionMoi;
    const meilleure = j.reduce((m,x)=>Math.max(m, Number(x.importance)||0), 0);
    const candidats = j.filter(x=>meilleure - (Number(x.importance)||0) <= ECART_IMPORTANCE);
    const choisi = depuis
      ? candidats.reduce((a,x)=>{
          const d = distanceM(depuis[0], depuis[1], parseFloat(x.lat), parseFloat(x.lon));
          return (a && a.d <= d) ? a : {x, d};
        }, null).x
      : candidats[0];

    const bb = choisi.boundingbox;                   // [sud, nord, ouest, est]
    return {
      lat: parseFloat(choisi.lat), lng: parseFloat(choisi.lon),
      nom: choisi.display_name || nom,
      emprise: Array.isArray(bb) && bb.length === 4
        ? [[parseFloat(bb[0]), parseFloat(bb[2])], [parseFloat(bb[1]), parseFloat(bb[3])]]
        : null,
    };
  }catch(e){ return null; }
}

/* Recherche dans une autre ville : on affiche les résultats de Google
   directement, au lieu de les filtrer sur les lieux déjà chargés ici. */
async function rechercherAilleurs(phrase, ville){
  charge("Recherche à "+ville+"…");
  const zone = await geocoderVille(ville);
  const pos = zone ? [zone.lat, zone.lng] : null;
  const depuis = pos || positionMoi;
  const res = await chercherGoogle(phrase, depuis[0], depuis[1]);
  charge(null);
  if(!res.length){ toast("Rien trouvé à "+ville); return; }

  if(pos && map){ map.flyTo(pos, 13, {duration:.8}); dernierChargement = pos; }
  ajouterLieuxGoogle(res, "commerce");

  // on retrouve les lieux tout juste ajoutés par leur identifiant calculé
  const ids = new Set(res.map(f=>"g"+hash(f.nom+f.lat)));
  const trouves = lieux.filter(l=>ids.has(l.id));
  if(!trouves.length){ toast("Rien trouvé à "+ville); return; }

  // le classement se fait depuis la ville visée, pas depuis ta position
  const vrai = positionMoi;
  positionMoi = depuis;
  const classes = classerLieux(trouves, false);
  positionMoi = vrai;

  selectionAccueil = false;
  fermerFeuille2();
  pileEcrans = [];
  pousserEcran(()=>afficherListe("📍", esc(ville), classes, false,
    ()=>rechercherAilleurs(phrase, ville)));
}

/* Ajoute les résultats Google à la liste déjà affichée, sans la bloquer. */
function completerParGoogle(q, catDefaut, redessiner){
  if(!positionMoi) return;
  chercherGoogle(q, positionMoi[0], positionMoi[1]).then(res=>{
    if(!res.length) return;
    if(ajouterLieuxGoogle(res, catDefaut)) redessiner();
  });
}

function appliquerSuggestion(s){
  const z = $("#suggestions"); if(z) z.hidden = true;
  const r = $("#rech"); if(r) r.blur();
  if(s.hasard){ surprendre(); return; }
  // « Un abri » à deux heures du matin : on entre dans le mode Aide, direct
  // sur le bon besoin, sans passer par un écran de plus
  if(s.modeAide){
    if(!modeAide) basculerAide();
    sousAide = s.sous || null;
    majFiltres(); rendre(); majAccueil(); majFeuille2();
    return;
  }
  if(s.f){
    filtresHumains.add(s.f);
    if(s.f === "famille") chargerEditorial("family");
    toutAfficher(); majFiltres();
    toast(s.t);
    return;
  }
  catsActives = new Set(s.cats);
  filtreActif = "tout";
  selectionAccueil = false;

  else if(s.cats.includes("cinema")) chargerEditorial("cinema");
  else if(s.cats.includes("event")) chargerEditorial("events");
  if(s.aide && positionMoi) chargerAide(positionMoi[0], positionMoi[1]);
