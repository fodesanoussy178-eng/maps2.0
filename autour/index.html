      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />

<style>
:root{
  --paper:#F7F8F5; --ink:#1F2A25; --ink2:#5D6B63; --signal:#FF4A17; --trait:#141E19;
  --bord:#DCE0D8; --ardoise:#2C3A33; --aide:#B82A3A;
  --sol:#F2F1EC; --bati:#E7E4DE; --vert:#C9E6C4; --eau:#A5CDEA;
  --voie:#FFFFFF; --liseré:#DFDCD5; --vite:#F8D28D; --vite-bord:#E9B96A;
  --label:#5F6863;
  /* couleurs d'application : l'orange marque le moment présent, le violet
     marque l'action de contribuer */
  --orange:#FF6B2C; --violet:#7C3AED; --violet-doux:#F1ECFE;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --sheet-visible-height:0px;
  /* hauteurs mesurées au lieu d'être devinées : l'en-tête et la barre basse
     changent de taille selon l'appareil et la présence des safe areas */
  --header-height:150px; --nav-height:calc(var(--safe-b) + 58px);
  /* bord bas réel de l'en-tête flottant : ce qui se range juste dessous doit
     s'y accrocher, pas à sa hauteur seule — l'en-tête ne commence pas à 0 */
  --header-bas:calc(var(--safe-t) + 54px);
  --map-control-bottom:max(calc(var(--nav-height) + 14px),calc(var(--sheet-visible-height) + 12px));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 100dvh : sur Safari iOS, 100vh inclut la barre d'URL et pousse le bas de
   l'application hors de l'écran. dvh suit la hauteur réellement visible. */
html,body{height:100%;height:100dvh;overscroll-behavior:none}
body{font-family:'Inter Tight',system-ui,-apple-system,sans-serif;color:var(--ink);
  background:var(--paper);-webkit-font-smoothing:antialiased;position:fixed;inset:0;width:100%}
body.ui-modal-open{overflow:hidden;touch-action:none}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:16px}

#map{position:absolute;inset:0;background:var(--sol)}
.leaflet-container{font-family:inherit;background:var(--sol)}
/* La carte est un décor : ni boutons +/-, ni bandeau d'attribution posé
   dessus. Le zoom se fait au pinch, et l'attribution — légalement due —
   vit derrière le « ⓘ » en bas à gauche (#btnCredits / #credits). */
.leaflet-control-zoom,.leaflet-control-attribution{display:none!important}
/* La carte descend sous l'en-tête arrondi et sous la barre basse : le fond
   continue derrière eux, ce qui donne la profondeur d'une app native. */
#map{top:0;bottom:0}

/* étiquettes de rue */
.rue{background:none;border:0;width:0!important;height:0!important}
.rue-in{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:10px;font-weight:500;color:var(--label);letter-spacing:.01em;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}

.mk{width:0!important;height:0!important;background:none;border:0}
.mk-in{position:absolute;left:0;top:0;display:block}
.mk-eph .mk-in{transform:translate(-50%,-100%)}
.mk-fix .mk-in{transform:translate(-50%,-50%)}

.affiche{position:relative;display:flex;flex-direction:column;gap:3px;width:max-content;
  max-width:152px;padding:7px 9px 8px;border:1px solid var(--bord);border-radius:2px;
  background:#fff;box-shadow:0 2px 10px rgba(20,30,25,.14);text-align:left;
  transform:rotate(var(--tilt,0deg));transform-origin:50% 100%;animation:surgit .2s ease-out}
.affiche::after{content:"";position:absolute;left:50%;bottom:-11px;width:1.5px;height:11px;
  background:rgba(31,42,37,.45);transform:translateX(-50%)}
.a-haut{display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.a-titre{font-size:12px;font-weight:600;line-height:1.25}
.a-lieu{font-size:10px;line-height:1.2;opacity:.72}
.a-places{opacity:.72;font-weight:500}
.gratuit{background:var(--signal);border-color:var(--signal);color:#fff}
.payant{background:#fff;color:var(--ink)}
.payant .a-haut{color:var(--ink2)}
/* Annulé : l'affiche reste sur la carte — la faire disparaître laisserait
   croire à une erreur — mais elle ne peut plus se lire comme un événement qui
   a lieu. Titre barré, couleurs éteintes, mention en clair. */
.affiche.annulee{background:#fff;border-color:var(--bord);color:var(--ink2);
  opacity:.72;filter:grayscale(1)}
.affiche.annulee .a-titre{text-decoration:line-through}
.affiche.annulee .a-haut{color:#B82A3A}
.rc-carte.annulee .rc-nom{text-decoration:line-through;color:var(--ink2)}
.rc-annule{color:#B82A3A;font-weight:700}

/* lieux permanents : pastille façon Maps — rond + nom dessous */
.poi{display:flex;flex-direction:column;align-items:center;gap:2px;animation:surgit .2s ease-out}
.poi-rond{width:23px;height:23px;border-radius:50%;background:#fff;border:1px solid var(--bord);
  display:grid;place-items:center;font-size:12px;line-height:1;box-shadow:0 1px 3px rgba(20,30,25,.28)}
.poi-nom{max-width:104px;text-align:center;font-size:10px;font-weight:600;line-height:1.15;
  color:#37423D;letter-spacing:-.005em;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.poi-rond{position:relative}

/* ---- Marqueurs de lieu façon application de découverte ------------------
   Pastille ronde colorée par catégorie + étiquette blanche à deux lignes :
   le nom, puis ce qui décide vraiment (heure de séance, heure de fermeture,
   temps de trajet). La carte montre des lieux, pas des points. */
.poi{flex-direction:row;align-items:center;gap:0}
.poi-rond{width:28px;height:28px;font-size:14px;border:0;color:#fff;
  box-shadow:0 2px 7px rgba(20,30,25,.30);z-index:2}
.poi-eti{display:flex;flex-direction:column;margin-left:-8px;padding:4px 10px 4px 14px;
  border-radius:0 9px 9px 0;background:rgba(255,255,255,.95);
  box-shadow:0 1px 6px rgba(20,30,25,.20);max-width:158px}
.poi-eti b{font-size:11.5px;font-weight:700;line-height:1.2;letter-spacing:-.01em;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poi-eti span{font-size:10.5px;line-height:1.25;color:var(--ink2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.poi-eti span.ouvre{color:#1B7F3B}
.loin .poi-eti,.poi-eti.masquee{display:none}
/* Basculée à gauche quand elle sortirait de l'écran à droite : la pastille ne
   bouge pas, seule l'étiquette change de côté. */
.poi-eti.a-gauche{order:-1;margin-left:0;margin-right:-8px;
  padding:4px 14px 4px 10px;border-radius:9px 0 0 9px;text-align:right}
.poi-ferme .poi-eti{background:rgba(255,255,255,.82)}
/* Fermé : atténué et badgé. Jamais le même style qu'un lieu ouvert, jamais
   masqué non plus — hors mode « Maintenant » il reste utile pour plus tard. */
.poi-ferme{opacity:.55;filter:grayscale(1)}
.poi-ferme .poi-rond{border-style:dashed;box-shadow:none}
.poi-ferme .poi-nom{color:#6B756F;font-weight:500}
.poi-ferme-badge{position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  padding:0 3px;border-radius:2px;background:#8A3B3B;color:#fff;
  font-size:7.5px;font-weight:700;line-height:1.5;letter-spacing:.02em;font-style:normal}
.inconnu{font-weight:600;color:var(--ink2)}
.poi-pastille{position:absolute;top:-5px;right:-6px;min-width:15px;height:15px;padding:0 3px;
  border-radius:99px;background:var(--signal);color:#fff;border:1.5px solid #fff;
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;font-style:normal;
  display:grid;place-items:center;animation:battement 2.2s ease-in-out infinite}
@keyframes battement{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.loin .poi-nom{display:none}
.loin .poi-rond{width:11px;height:11px;font-size:0;border-width:1.5px;background:var(--ardoise)}

/* ---- liste classée d'une catégorie ---- */
/* ---- bloc "où", date et heure ---- */
.ou{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--bord);
  border-radius:3px;background:#fff}
.ou-txt{flex:1;min-width:0}
.ou-nom{display:block;font-size:14px;font-weight:600;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ou-coord{display:block;margin-top:2px;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--ink2)}
.ou-bouton{flex-shrink:0;padding:8px 12px;border:1px solid var(--bord);border-radius:99px;
  background:var(--paper);font-family:'JetBrains Mono',monospace;font-size:9.5px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.duo{display:flex;gap:9px}
.duo>label{flex:1;min-width:0}
.champ input[type=date],.champ input[type=time]{width:100%;padding:12px;
  border:1px solid var(--bord);border-radius:2px;background:#fff;color:var(--ink);
  font-family:inherit;font-size:15px}
.champ input[type=date]:focus,.champ input[type=time]:focus{outline:2px solid var(--signal);outline-offset:1px}
.apercu-quand{margin-top:9px;padding:9px 12px;border-radius:2px;background:rgba(255,74,23,.09);
  font-size:13px;font-weight:600;color:var(--ink)}
.raccourcis{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}

.liste-tete{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.liste-tete h2{font-family:'Anton',sans-serif;font-size:25px;line-height:1;text-transform:uppercase}
.liste-compte{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.liste-tri{margin:0 0 14px;font-size:11.5px;color:var(--ink2);line-height:1.45}
.tri-barre{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 9px}
.tri-barre .tri{padding:7px 12px;border:1px solid var(--bord);border-radius:99px;background:#fff;
  color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
.tri-barre .tri.actif{background:var(--ardoise);border-color:var(--ardoise);color:#fff}
.rang{display:flex;align-items:center;gap:11px;width:100%;padding:11px 4px;border:0;
  border-top:1px solid var(--bord);background:none;text-align:left}
.rang:last-of-type{border-bottom:1px solid var(--bord)}
.rang-n{flex-shrink:0;width:26px;font-family:'JetBrains Mono',monospace;font-size:12px;
  font-weight:700;color:var(--ink2)}
.rang-emoji{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#fff;
  border:1px solid var(--bord);display:grid;place-items:center;font-size:14px}
.rang-txt{flex:1;min-width:0}
.rang-nom{display:block;font-size:14.5px;font-weight:600;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rang-sous{display:block;margin-top:2px;font-size:11.5px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rang-dist{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11px;
  font-weight:700;color:var(--ink2)}
.rang-note{display:inline-flex;align-items:center;gap:3px;margin-right:7px;font-weight:700;color:var(--ink)}
.ouvert{font-weight:700;color:#1B7F3B}
.ferme{font-weight:700;color:var(--signal)}
.badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:99px;
  background:var(--signal);color:#fff;font-family:'JetBrains Mono',monospace;
  font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.badge.mien{background:var(--ardoise)}
.liste-vide{padding:26px 0 10px;text-align:center;font-size:14px;color:var(--ink2);line-height:1.6}

.pastille{display:flex;align-items:center;gap:5px;padding:5px 9px 5px 6px;width:max-content;
  max-width:150px;border:1px solid var(--bord);border-radius:99px;
  background:rgba(255,255,255,.94);box-shadow:0 1px 3px rgba(20,30,25,.14);animation:surgit .2s ease-out}
@keyframes surgit{from{opacity:0}to{opacity:1}}

.loin .affiche,.loin .pastille{width:13px;height:13px;max-width:none;padding:0;gap:0;
  border-radius:50%;border-width:1.5px;overflow:hidden;transform:none;
  box-shadow:0 1px 3px rgba(20,30,25,.3)}
.loin .affiche::after,.loin .affiche>*,.loin .pastille>*{display:none}
.loin .pastille{background:#fff;border-color:var(--ink2)}
.loin .mk-eph .mk-in{transform:translate(-50%,-50%)}
.loin .rue-in{display:none}

.moi-in{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  display:grid;place-items:center;width:46px;height:46px}
.mk-user{width:46px!important;height:46px!important}
.mk-user .moi-in{left:23px;top:23px}
.moi-in i{position:absolute;width:46px;height:46px;border-radius:50%;
  background:rgba(39,112,255,.18);animation:respire 2.4s ease-in-out infinite}
/* Point bleu et halo, comme toute application de carte : la convention est
   assez forte pour être reconnue sans être expliquée. Un emoji faisait
   ressembler la position de l'utilisateur à un lieu de plus. */
.moi-in b{display:block;width:17px;height:17px;border-radius:50%;
  background:#1A73E8;border:2.5px solid #fff;
  box-shadow:0 1px 5px rgba(19,72,157,.45)}
.loin .moi-in b{width:13px;height:13px;border-width:2px}
@keyframes respire{0%,100%{transform:scale(.7);opacity:.9}50%{transform:scale(1);opacity:.35}}


/* Les bandeaux se posent SOUS l'en-tête : sa hauteur est mesurée, donc ils
   ne recouvrent plus la recherche quel que soit l'appareil. */
#bandeauGeo,#bandeauVide{position:absolute;left:16px;right:16px;
  top:calc(var(--header-bas) + 10px);z-index:650;
  display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--bord);
  border-radius:99px;background:#fff;font-size:13px;line-height:1.3;
  box-shadow:0 3px 14px rgba(20,30,25,.18);animation:monteT .26s}
#bandeauTxt,#videTxt{flex:1;min-width:0}
#bandeauOk,#videOk{flex-shrink:0;min-height:44px;padding:8px 14px;border:0;border-radius:99px;background:var(--signal);
  color:#fff;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
#charge{position:absolute;top:calc(var(--header-bas) + 10px);left:50%;transform:translateX(-50%);
  z-index:700;padding:9px 14px;border:1px solid var(--bord);border-radius:99px;
  background:#fff;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;box-shadow:0 2px 10px rgba(20,30,25,.14)}

/* ---- En-tête flottant compact -------------------------------------------
   La carte est le produit : l'interface se pose dessus au lieu de la
   repousser. Une pastille de contexte, une loupe, une cloche — rien qui
   occupe une bande pleine largeur. */
#appHeader{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;
  z-index:600;display:flex;align-items:center;gap:8px;background:none;
  box-shadow:none;padding:0;border-radius:0}
#btnMaintenant{flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  height:44px;padding:0 14px;border:1px solid var(--bord);border-radius:99px;
  background:#fff;color:var(--ink2);font-size:14px;font-weight:700;
  box-shadow:0 2px 12px rgba(20,30,25,.16);
  overflow:hidden;white-space:nowrap;
  transition:background .16s ease,color .16s ease}
#btnMaintenant.actif{background:var(--orange);border-color:var(--orange);color:#fff;
  box-shadow:0 3px 14px rgba(255,107,44,.38)}
.hd-sep{font-style:normal;opacity:.5}
#btnMaintenant b{min-width:0;overflow:hidden;text-overflow:ellipsis;
  font-weight:800;color:inherit}
.hd-icone{position:relative;flex-shrink:0;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--bord);background:#fff;color:var(--ink);
  display:grid;place-items:center;box-shadow:0 2px 12px rgba(20,30,25,.16)}
.hd-icone i{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;
  background:var(--signal);border:1.5px solid #fff}

/* ---- Recherche superposée ------------------------------------------------
   Elle recouvre la carte sans la remplacer : on garde le décor, on ajoute
   l'intention. */
#rechercheOverlay{position:absolute;top:0;left:0;right:0;z-index:660;
  padding:calc(var(--safe-t) + 10px) 16px 14px;
  background:#fff;border-radius:0 0 22px 22px;
  box-shadow:0 4px 22px rgba(20,30,25,.16);animation:monteT .16s ease-out}
.ro-barre{display:flex;align-items:center;gap:10px;position:relative}
.ro-barre > svg{position:absolute;margin-left:15px;color:var(--ink2);pointer-events:none}
.ro-barre input{flex:1;min-width:0;height:46px;padding:0 44px 0 42px;
  border:1px solid var(--bord);border-radius:99px;background:#fff;
  color:var(--ink);font-size:15px;outline:0}
.ro-barre input::placeholder{color:#9AA49D;font-size:14.5px}
.ro-barre input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.icone-btn{position:absolute;right:62px;width:38px;height:38px;border:0;background:none;
  color:var(--ink2);display:grid;place-items:center;padding:4px}
.hd-filtres{flex-shrink:0;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--bord);background:#fff;color:var(--ink);
  display:grid;place-items:center}

/* ---- Pills de catégories ------------------------------------------------
   Petites, horizontales, scrollables. La sélection est pleine et colorée :
   elle doit se lire d'un coup d'œil, sans comparer les bordures. */
/* Carousel horizontal : la rangée occupe toute la largeur, mais le premier
   et le dernier élément restent entiers grâce au padding et au scroll-padding.
   Une pill coupée au bord se lit comme un défaut d'affichage, pas comme une
   invitation à faire défiler. */
.pills{display:flex;gap:6px;margin:10px -16px 0;
  padding-inline:16px;scroll-padding-inline:16px;padding-block:2px;
  overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.rc{scroll-snap-align:start}
.pills::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;display:flex;align-items:center;gap:5px;height:34px;padding:0 10px;
  border:1px solid var(--bord);border-radius:99px;background:#fff;color:var(--ink);
  font-size:12.5px;font-weight:650;white-space:nowrap;
  box-shadow:0 1px 4px rgba(20,30,25,.07);transition:background .16s ease,color .16s ease}
.rc em{font-size:13px;font-style:normal;line-height:1}
.rc:active{transform:scale(.97)}
.rc.actif{background:var(--violet);border-color:var(--violet);color:#fff;
  box-shadow:0 3px 12px rgba(124,58,237,.34)}
.rc.aide.actif{background:var(--aide);border-color:var(--aide)}

/* ---- Carousel « Pour toi, maintenant » ---------------------------------- */
.rc-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:2px 0 12px}
.rc-tete strong{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.rc-tout{flex-shrink:0;white-space:nowrap;border:0;background:none;
  color:var(--violet);font-size:14.5px;font-weight:700}
.rc-piste{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;
  padding:0 0 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rc-piste::-webkit-scrollbar{display:none}
.rc-carte{flex:0 0 178px;scroll-snap-align:start;display:flex;flex-direction:column;
  border:1px solid var(--bord);border-radius:16px;background:#fff;overflow:hidden;
  text-align:left;box-shadow:0 2px 10px rgba(20,30,25,.09)}
.rc-carte:active{transform:scale(.985)}
.rc-photo{display:block;height:74px;background:var(--paper) center/cover no-repeat}
/* Tuile de repli : teintée par la catégorie, avec une petite icône. Elle
   doit ressembler à une composition, pas à une image qui n'a pas chargé. */
/* Champ photo du formulaire de publication */
.photo-champ{position:relative;display:block;margin-top:8px;height:104px;
  border:1px dashed var(--bord);border-radius:12px;background:var(--paper);
  overflow:hidden;cursor:pointer}
.photo-champ.rempli{border-style:solid}
.photo-champ img{width:100%;height:100%;object-fit:cover;display:block}
.photo-champ input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-vide{position:absolute;inset:0;display:grid;place-items:center;
  font-size:13.5px;font-weight:600;color:var(--ink2)}
.photo-retirer{margin-top:8px;padding:7px 12px;border:1px solid var(--bord);
  border-radius:99px;background:#fff;font-size:12.5px;font-weight:600}
.champ span i{font-style:normal;font-weight:500;color:var(--ink2)}

/* Choix du type de publication, avant toute question de localisation */
.creer-choix{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
.creer-type{display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:14px 14px 15px;border:1px solid var(--bord);border-radius:16px;background:#fff;
  text-align:left}
.creer-type em{font-size:24px;font-style:normal;line-height:1}
.creer-type b{font-size:14.5px;font-weight:700}
.creer-type:active{background:var(--paper)}
/* « Créer » est le seul onglet à porter une pastille pleine : il reste
   identifiable sans déséquilibrer le rail, et remplace l'ancien bouton
   flottant qui faisait doublon. */
.nb-creer{color:var(--violet)}
.nb-plus{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;
  background:var(--violet);color:#fff;font-style:normal;
  box-shadow:0 3px 10px rgba(124,58,237,.34)}
.nb-creer svg{opacity:1}
.nb.avec-pastille{position:relative}
.nb.avec-pastille::after{content:"";position:absolute;top:4px;right:50%;
  transform:translateX(16px);width:7px;height:7px;border-radius:50%;background:var(--signal)}

.rc-photo-vide{position:relative;display:grid;place-items:center;
  background:var(--teinte,#5D6B63)}
.rc-photo-vide::after{content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.80),rgba(255,255,255,.90))}
.rc-photo-vide i{position:relative;z-index:1;font-size:20px;font-style:normal;opacity:.9}
/* La photo se pose par-dessus le placeholder une fois chargée : aucun saut
   de mise en page, et rien à attendre pour lire la carte. */
.rc-photo img{position:absolute;inset:0;z-index:2;width:100%;height:100%;
  object-fit:cover;opacity:0;transition:opacity .18s ease}
.rc-photo img.vue{opacity:1}
.rc-corps{display:flex;flex-direction:column;gap:3px;padding:10px 11px 12px}
.rc-haut{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rc-haut .coeur{width:30px;height:30px;margin:-4px -6px -4px 0}
.rc-cats{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.06em;color:var(--violet)}
.rc-nom{font-size:14px;font-weight:750;letter-spacing:-.01em;line-height:1.2;
  min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-ligne{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.rc-note{font-size:12.5px;font-weight:650}
.rc-note i{font-style:normal;font-weight:500;color:var(--ink2)}
.rc-min{font-size:12.5px;font-weight:750;color:var(--violet)}
.rc-trajet{font-size:12px;color:var(--ink2);margin-top:2px}
.rc-arrivee{font-size:11.5px;color:var(--ink2)}

/* ---- Cœur des favoris --------------------------------------------------- */
.coeur{flex-shrink:0;width:40px;height:40px;border:0;background:none;border-radius:50%;
  color:var(--ink2);display:grid;place-items:center;transition:transform .12s ease}
.coeur.actif{color:#E0334E}
.coeur.actif svg{fill:currentColor}
.coeur:active{transform:scale(.88)}

/* ---- Fiche compacte ----------------------------------------------------- */
#ficheCompacte{position:absolute;left:12px;right:12px;
  bottom:calc(var(--nav-height) + 12px);z-index:645;
  display:flex;flex-direction:column;gap:3px;padding:14px 14px 12px;
  border:1px solid var(--bord);border-radius:20px;background:#fff;
  box-shadow:0 6px 26px rgba(20,30,25,.20);animation:monteB .18s ease-out}
@keyframes monteB{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.fc-tete{display:flex;align-items:center;gap:10px}
.fc-tete b{flex:1;min-width:0;font-size:17px;font-weight:750;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-l2{font-size:13px;color:var(--ink2)}
.fc-l3{font-size:13px;font-weight:650}
.fc-modes{margin-top:2px;font-size:13px;color:var(--ink2)}
.fc-actions{display:flex;gap:8px;margin-top:10px}
.fc-actions button{flex:1;min-height:44px;padding:0 12px;border:1px solid var(--bord);
  border-radius:12px;background:#fff;font-size:14px;font-weight:650}
.fc-y{background:var(--violet)!important;border-color:var(--violet)!important;color:#fff}

/* ---- Annonces d'un événement ------------------------------------------- */
.an-msg{display:flex;flex-direction:column;gap:2px;margin:0 0 8px;padding:10px 12px;
  border-left:3px solid var(--bord);border-radius:0 10px 10px 0;background:var(--paper)}
.an-msg.systeme{border-left-color:var(--violet);background:var(--violet-doux)}
.an-msg.urgent{border-left-color:var(--aide);background:#FBEDEE}
.an-tag{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.an-msg.urgent .an-tag{color:var(--aide)}
.an-corps{font-size:14px;line-height:1.35}
.an-actions{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
.an-act{padding:10px 13px;border:1px solid var(--bord);border-radius:99px;background:#fff;
  font-size:13.5px;font-weight:650}
.an-act.danger{color:var(--aide);border-color:var(--aide)}
.an-suivre{width:100%;margin:6px 0 12px;padding:13px;border:1px solid var(--violet);
  border-radius:12px;background:var(--violet-doux);color:var(--violet);
  font-size:14.5px;font-weight:700}
.lien-fort{font-weight:700;color:var(--violet)}

/* ---- Prochains départs -------------------------------------------------- */
.tr-bloc{display:flex;align-items:center;gap:12px;margin:16px 0 8px;padding:13px 14px;
  border-radius:14px;background:var(--violet-doux)}
.tr-icone{flex-shrink:0;width:38px;height:38px;border-radius:11px;background:#fff;
  display:grid;place-items:center;font-size:18px}
.tr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tr-titre{font-size:14.5px;font-weight:700;color:var(--violet)}
.tr-lignes{font-size:13px;color:var(--ink)}
.tr-lignes b{font-weight:750}
.tr-vide{color:var(--ink2);font-size:12.5px}
.tr-tout{flex-shrink:0;padding:8px 13px;border:1px solid var(--bord);border-radius:99px;
  background:#fff;font-size:13px;font-weight:650}

#suggestions{position:absolute;left:14px;right:14px;top:calc(100% - 6px);z-index:610;
  max-height:46vh;overflow-y:auto;
  border:1px solid var(--bord);border-radius:16px;background:#fff;
  box-shadow:0 6px 24px rgba(20,30,25,.22);animation:monteT .18s}
.sg{display:flex;align-items:center;gap:9px;width:100%;padding:11px 14px;border:0;
  border-top:1px solid rgba(20,30,25,.08);background:none;text-align:left;font-size:14px;
  color:var(--ink)}
.sg:first-child{border-top:0}
.sg:active{background:var(--paper)}
.sg-emo{width:22px;text-align:center;font-size:15px}
.sg-sous{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink2)}
.sg-rapides{display:flex;gap:6px;padding:9px 12px;overflow-x:auto;scrollbar-width:none}
.sg-rapides::-webkit-scrollbar{display:none}
.sg-rapide{flex:0 0 auto;padding:7px 12px;border:1px solid var(--bord);border-radius:99px;
  background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}

/* ---- Barre de navigation basse -----------------------------------------
   Cinq onglets, comme une application native. Deux d'entre eux (Favoris,
   Messages) n'ont pas encore de fonctionnalité : ils sont explicitement
   désactivés plutôt que muets, pour ne pas promettre un écran inexistant. */
#navBas{position:absolute;left:0;right:0;bottom:0;z-index:660;
  display:flex;align-items:stretch;
  padding:6px 4px calc(var(--safe-b) + 6px);
  background:#fff;border-top:1px solid rgba(20,30,25,.09)}
.nb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border:0;background:none;color:var(--ink2);
  font-size:11px;font-weight:600;line-height:1.1}
.nb svg{opacity:.85}
.nb.actif{color:var(--violet)}
.nb.actif svg{opacity:1}
.nb[aria-disabled="true"]{opacity:.38}

/* Les filtres ne flottent plus au milieu de la carte : ils forment une ligne
   compacte sous les catégories, et seulement quand on les a demandés. */
#filtresHumains{display:flex;gap:6px;margin:8px -16px 0;
  padding-inline:16px;scroll-padding-inline:16px;padding-block:2px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#filtresHumains::-webkit-scrollbar{display:none}
.fh{flex:0 0 auto;padding:7px 12px;border:1px solid var(--bord);border-radius:99px;
  background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap}
.fh.actif{background:var(--ardoise);border-color:var(--ardoise);color:#fff}

/* ---- Boutons flottants sur la carte -------------------------------------
   Petites icônes rondes à droite : se recentrer, voir les transports. Elles
   ne portent plus de libellé — l'icône suffit et rend la carte au décor. */
.rond-flottant{position:absolute;right:16px;z-index:601;width:44px;height:44px;
  border-radius:50%;border:1px solid var(--bord);background:#fff;color:var(--ink);
  font-size:18px;line-height:1;display:grid;place-items:center;
  box-shadow:0 2px 10px rgba(20,30,25,.16);
  transition:bottom .22s ease,transform .15s ease}
/* Un interrupteur doit dire s'il est allumé : la couche transport est un état,
   pas une action ponctuelle. */
.rond-flottant.actif{background:var(--violet);border-color:var(--violet);color:#fff}
#btnTransports{bottom:calc(var(--map-control-bottom) + 56px)}
#btnAide{bottom:calc(var(--map-control-bottom) + 108px)}
/* actif : le rouge de l'aide, distinct du violet de la couche transport */
#btnAide.actif{background:var(--urgence,#B82A3A);border-color:var(--urgence,#B82A3A);color:#fff}
.rond-flottant:active{transform:scale(.94)}

/* Attribution : obligatoire, donc conservée — mais repliée derrière un « ⓘ »
   au lieu d'occuper le bas de la carte en permanence. */
/* Retour à soi : n'apparaît que lorsqu'on s'est éloigné, sinon il ne veut
   rien dire et occupe la carte pour rien. */
/* Compact et sur une seule ligne : sur 390 px, « ⌖ Revenir autour de moi » en
   14 px passait à la ligne et faisait un pavé de deux étages sous l'en-tête. */
#btnAutourDeMoi{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(var(--header-bas) + 10px);z-index:604;
  height:34px;padding:0 13px;border:0;border-radius:99px;
  background:var(--trait);color:#fff;font-size:12.5px;font-weight:700;
  white-space:nowrap;max-width:calc(100vw - 32px);
  overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 4px 16px rgba(20,30,25,.30);animation:monteT .18s ease-out}
#btnAutourDeMoi:active{transform:translateX(-50%) scale(.96)}

#btnCredits{position:absolute;left:12px;bottom:calc(var(--map-control-bottom) + 4px);z-index:601;
  width:26px;height:26px;border-radius:50%;border:1px solid var(--bord);
  background:rgba(255,255,255,.9);color:var(--ink2);font-size:13px;line-height:1;
  display:grid;place-items:center;transition:bottom .22s ease}
#credits{position:absolute;left:12px;right:12px;bottom:calc(var(--map-control-bottom) + 36px);
  z-index:601;padding:8px 11px;border:1px solid var(--bord);border-radius:10px;
  background:rgba(255,255,255,.96);font-size:11px;line-height:1.4;color:var(--ink2);
  box-shadow:0 2px 10px rgba(20,30,25,.16)}
#credits a{color:var(--ink2)}


/* ---- bottom sheet : fermée · compacte · dépliée ---- */
#feuilleBesoins{position:absolute;left:8px;right:8px;bottom:0;z-index:640;
  display:flex;flex-direction:column;
  width:auto;max-width:none;margin:0;
  height:45dvh;max-height:45dvh;
  background:#fff;border:1px solid var(--bord);border-bottom:0;border-radius:22px 22px 0 0;
  box-shadow:0 -3px 18px rgba(20,30,25,.13);
  transition:height .22s ease,max-height .22s ease}
/* À l'accueil la feuille est l'écran lui-même : elle occupe toute la largeur
   et se passe de barre de titre, le titre étant dans le corps. */
#feuilleBesoins.accueil{left:0;right:0;border-left:0;border-right:0}
#feuilleBesoins.accueil .fb-tete{display:none}
#feuilleBesoins.deplie{height:80dvh;max-height:80dvh}
/* État réduit : la poignée et le titre restent lus, la carte reprend la main.
   La feuille ne disparaît jamais complètement — elle dit toujours ce qu'elle
   contient. */
#feuilleBesoins.reduite{height:144px;max-height:144px}
#feuilleBesoins.reduite .fb-corps{overflow:hidden}
.fb-poignee{position:relative;flex-shrink:0;display:block;width:64px;height:44px;margin:0 auto;border:0;
  background:transparent;padding:0;touch-action:none}
.fb-poignee::before{content:"";position:absolute;left:9px;right:9px;top:16px;height:5px;
  border-radius:99px;background:rgba(20,30,25,.25)}
.fb-tete{position:relative;z-index:2;flex-shrink:0;display:flex;align-items:center;gap:8px;
  min-height:52px;padding:0 12px 8px;background:var(--paper)}
.fb-titre{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-retour,.fb-x{flex-shrink:0;width:44px;height:44px;border:0;border-radius:50%;
  background:#fff;border:1px solid var(--bord);color:var(--ink);
  font-size:16px;line-height:1;display:grid;place-items:center}
.fb-retour{font-size:22px}
.fb-corps{flex:1;min-height:0;overflow-y:auto;padding:0 16px calc(var(--safe-b) + 20px);
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}

/* les grands choix : un par ligne, larges, lisibles de loin */
.bn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;margin-bottom:8px;
  border:1px solid var(--bord);border-radius:14px;background:#fff;text-align:left;
  font-size:15.5px;font-weight:600;color:var(--ink)}
.bn em{font-size:22px;font-style:normal;line-height:1}
.bn b{flex:1;min-width:0;font-weight:600}
.bn i{flex-shrink:0;font-style:normal;font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:700;color:var(--ink2)}
.bn:active{background:var(--paper)}
.bn.actif{background:var(--ardoise);border-color:var(--ardoise);color:#fff}
.bn.actif i{color:rgba(255,255,255,.72)}
.bn.actif::after{content:"✓";font-size:15px;font-weight:700}
.fb-section{margin:14px 2px 8px;font-family:'JetBrains Mono',monospace;font-size:9.5px;
  font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2)}
.fb-resultats-tete{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  margin:2px 2px 6px}
.fb-resultats-tete strong{font-size:14px;line-height:1.25}
.fb-resultats-tete span{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink2);
  text-transform:uppercase;letter-spacing:.08em;text-align:right}
.fb-statut{margin:4px 0 10px;padding:11px 12px;border-radius:12px;background:#fff;
  border:1px solid var(--bord);font-size:13px;line-height:1.4;color:var(--ink2)}
.fb-statut.erreur{border-color:#E6B3AA;background:#FFF4F1;color:#713127}
.fb-statut button{min-height:44px;margin-top:8px;padding:8px 13px;border:1px solid var(--bord);
  border-radius:99px;background:#fff;color:var(--ink);font-weight:700}
.fb-plus{display:block;margin:8px 0 4px;padding:9px 0;border-top:1px solid var(--bord);
  color:var(--ink2);font-size:12px;text-align:center}
.fb-vide{padding:16px 4px;font-size:14px;line-height:1.5;color:var(--ink2)}
.fb-vide button{margin-top:10px;padding:12px 18px;border:0;border-radius:12px;
  background:var(--trait);color:#fff;font-size:14px;font-weight:700}
.fb-pied{display:flex;flex-wrap:wrap;gap:14px;margin:18px 2px 4px;
  padding-top:14px;border-top:1px solid rgba(20,30,25,.1)}
.fb-pied button{min-height:44px;border:0;background:none;padding:8px 0;font-size:12.5px;
  color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

/* ---- résultats : cinq suggestions, pas trente ---- */
.ac-item{display:flex;align-items:center;gap:11px;width:100%;min-height:56px;padding:11px 2px;border:0;
  border-top:1px solid rgba(20,30,25,.1);background:none;text-align:left}
.ac-item:first-child{border-top:0}
.ac-item:active{opacity:.6}
.ac-emoji{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#fff;
  border:1px solid var(--bord);display:grid;place-items:center;font-size:14px}
.ac-txt{flex:1;min-width:0}
.ac-nom{display:block;font-size:14.5px;font-weight:600;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-sous{display:block;margin-top:2px;font-size:11.5px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raison{color:var(--signal);font-weight:600}
.ac-dist{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11px;
  font-weight:700;color:var(--ink2)}

/* ---- Tablette : mêmes composants, feuille centrée et plus large --------- */
@media (min-width:768px) and (max-width:1099px){
  #appHeader{padding-left:24px;padding-right:24px}
  .hd-rech input{height:52px}
  #feuilleBesoins,#feuilleBesoins.accueil{left:50%;right:auto;bottom:calc(var(--nav-height) + 12px);
    width:min(720px,calc(100% - 32px));
    height:52dvh;max-height:52dvh;transform:translateX(-50%);
    border:1px solid var(--bord);border-radius:22px}
  #feuilleBesoins.deplie{height:82dvh;max-height:82dvh}
  .rc-carte{flex:0 0 210px}
}

/* ---- Desktop : la même application, carte plein écran ---------------------
   Rien n'est dupliqué et rien n'est réservé autour de la carte : elle occupe
   toute la fenêtre et sert de canvas, exactement comme en mobile. Les mêmes
   éléments changent seulement de place et de taille :
     · la barre d'onglets devient une pastille flottante en bas à gauche ;
     · l'en-tête reste une pastille flottante, en haut à gauche ;
     · la recherche se pose sous l'en-tête au lieu de couvrir la largeur ;
     · « Pour toi, maintenant » devient un panneau latéral temporaire, que la
       croix referme pour rendre toute la fenêtre à la carte ;
     · le carousel de ce panneau devient une liste verticale.
   Aucune sidebar permanente, aucun rail : tout flotte au-dessus de la carte.
   Priorité mobile conservée : ces règles ne s'ajoutent qu'au-delà de 1100px. */
@media (min-width:1100px){
  :root{
    --panneau:400px;        /* panneau de résultats, temporaire */
    --nav-height:0px;       /* la navigation flotte : rien à réserver */
  }

  /* La carte est le canvas : elle occupe toute la fenêtre, sans rail ni
     colonne qui la rognent. Tout le reste se pose dessus. */
  #map{left:0;right:0;top:0;bottom:0}

  /* Navigation : une pastille flottante en bas à gauche, pas un rail
     pleine hauteur. Même produit qu'en mobile, autre disposition. */
  #navBas{top:auto;bottom:20px;left:20px;right:auto;width:auto;
    flex-direction:row;gap:2px;padding:6px;
    border-top:0;border-radius:99px;
    box-shadow:0 6px 26px rgba(20,30,25,.20)}
  .nb{flex:0 0 auto;gap:4px;padding:8px 14px;border-radius:99px;font-size:12px}
  .nb.actif{background:var(--violet-doux)}

  /* L'en-tête reste la même pastille flottante, simplement plus large. */
  #appHeader{left:20px;right:auto;top:calc(var(--safe-t) + 20px);
    width:auto;max-width:520px}
  #btnMaintenant{flex:0 0 auto;max-width:340px}

  /* La recherche se pose en haut à gauche, sous l'en-tête, au lieu de
     recouvrir toute la largeur. */
  #rechercheOverlay{left:20px;right:auto;top:calc(var(--safe-t) + 20px);
    width:min(520px,calc(100vw - 40px));
    border-radius:22px;padding:16px}

  /* Panneau de résultats : temporaire, fermable, jamais une sidebar. Il
     n'apparaît que si la feuille est ouverte, et la croix le referme pour
     rendre toute la fenêtre à la carte. */
  #feuilleBesoins,#feuilleBesoins.accueil,#feuilleBesoins.deplie,
  #feuilleBesoins.reduite{
    left:auto;right:20px;top:calc(var(--safe-t) + 20px);bottom:20px;
    width:var(--panneau);height:auto;max-height:none;transform:none;
    border:1px solid var(--bord);border-radius:22px;
    box-shadow:0 8px 34px rgba(20,30,25,.18)}
  .fb-poignee{display:none}
  .fb-tete{padding-top:10px;border-radius:22px 22px 0 0}
  /* la croix doit rester visible même sur l'accueil : c'est elle qui rend
     l'espace à la carte */
  #feuilleBesoins.accueil .fb-tete{display:flex}
  #feuilleBesoins.accueil .fb-titre{opacity:0}

  /* Le carousel devient une liste verticale : sur grand écran on fait
     défiler vers le bas, pas latéralement. */
  .rc-piste{flex-direction:column;overflow-x:visible;scroll-snap-type:none}
  .rc-carte{flex:0 0 auto;width:100%;flex-direction:row;align-items:stretch}
  .rc-photo{width:96px;height:auto;min-height:96px;flex-shrink:0}
  .rc-corps{flex:1;min-width:0}
  .rc-nom{min-height:0}

  /* Flottants de droite : ils se décalent seulement quand le panneau est
     ouvert, sinon ils longent le bord de la fenêtre. */
  #btnTransports,#btnAide{right:20px}
  body.sheet-open #btnTransports,body.sheet-open #btnAide{
    right:calc(var(--panneau) + 40px)}
  #btnTransports{bottom:44px}
  #btnAide{bottom:96px}
  /* l'attribution se pose au-dessus de la pastille de navigation, qui occupe
     désormais le coin bas gauche */
  #btnCredits{left:20px;bottom:calc(var(--nav-flottante,60px) + 28px)}
  #credits{left:20px;right:auto;width:min(420px,40vw);
    bottom:calc(var(--nav-flottante,60px) + 64px)}

  /* La fiche compacte se pose en bas au centre de la carte disponible. */
  #ficheCompacte{left:50%;right:auto;transform:translateX(-50%);
    width:min(460px,calc(100vw - 40px));bottom:20px}
  body.sheet-open #ficheCompacte{
    left:calc((100vw - var(--panneau) - 40px) / 2 + 20px)}

  #bandeauGeo,#bandeauVide{left:20px;right:auto;width:min(520px,45vw)}
  #charge{left:50%}
  #filtresHumains{width:auto;max-width:none}
  /* desktop : l'en-tête flotte à gauche, le bouton se pose à sa droite plutôt
     que dessous — il y a la place, et le centre appartient à la carte */
  #btnAutourDeMoi{left:auto;right:auto;transform:none;
    margin-left:560px;top:calc(var(--safe-t) + 26px)}
  #btnAutourDeMoi:active{transform:scale(.96)}
}

#panne{position:absolute;left:14px;right:14px;top:calc(var(--safe-t) + 70px);z-index:2000;
  padding:14px 16px;border:1px solid var(--bord);border-radius:3px;background:#fff;
  font-size:13px;line-height:1.55;box-shadow:0 2px 10px rgba(20,30,25,.14)}

#panne button{margin-top:10px;padding:8px 12px;border:1px solid var(--bord);
  border-radius:99px;background:var(--ardoise);color:#fff;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="availability.js"></script>
<script src="events.js"></script>
<script src="core.js"></script>
<script src="transit.js"></script>
<script>
function panne(titre, corps){
  const p = document.getElementById("panne");
  p.innerHTML = "<strong>"+titre+"</strong>"+corps+
    '<button onclick="document.getElementById(\'panne\').hidden=true">Fermer</button>';
  p.hidden = false;
}
/* Diagnostic. Silencieux par défaut : ces lignes servaient à mettre au point
   le pipeline, et elles partaient dans la console de tout le monde — du bruit,
   et un aperçu gratuit du fonctionnement interne. `__autourDebug = true` les
   rallume. Les vraies erreurs, elles, passent toujours par console.error. */
const journal = {
  info(...a){ if(window.__autourDebug) console.info(...a); },
  warn(...a){ if(window.__autourDebug) console.warn(...a); },
};

window.addEventListener("error", e=>{ panne("Ça a coincé", e.message||"Script externe indisponible."); });

const {
  FAMILY_CATEGORIES,
  classifyPlace,
  toCommonItem,
  matchesCategory,
  dedupeItems,
  groupLogicalPlaces,
  parseSearchQuery,
  isAvailableNow,
  rankResults,
} = window.AutourCore;

/* Déclarés ici parce que le démarrage les lit bien avant les blocs qui les
   définissent : sans ça, la zone morte temporelle casse le premier rendu. */
let villeDetectee = null;
let canauxAMoi = [];

/* ---- Recherche géographique ----------------------------------------------
   « Tourcoing », « Wazemmes » : on déplace la carte vers la zone et on
   n'affiche d'abord que trois à cinq résultats fortement pertinents. Le reste
   se charge derrière, sans bloquer. */
let rechercheGeo = null;              // {nom, lat, lng} de la zone visée
/* La zone dont la feuille affiche les résultats. Null = recommandations
   habituelles. C'est ce qui permet aux résultats de survivre à l'arrivée des
   données, qui redessine la feuille une seconde plus tard.
   Déclaré ici, avec rechercheGeo : majFeuille2() le lit dès le premier rendu,
   bien avant le bloc qui définit ouvrirResultatsZone. */
let zoneAffichee = null;
const RESULTATS_RECHERCHE_INITIAUX = 5;

/* Une requête est géographique si elle n'est pas, EXACTEMENT, un mot du
   vocabulaire de l'application : on ne géocode pas « pizza », mais on géocode
   « Bar-le-Duc ». Aucune ville n'est listée nulle part — c'est le géocodeur
   qui tranche, et lui seul. */
function ressembleAUneZone(q){
  const texte = (q||"").trim();
  if(texte.length < 3) return false;
  if(estTermeMetier(texte)) return false;
  return /^[\p{L}\d\s'’-]+$/u.test(texte);
}

/* Cadrage : on suit l'emprise réelle de la zone, bornée des deux côtés.
   Sans borne haute, un hameau remplissait l'écran d'un seul pâté de maisons ;
   sans borne basse, une métropole s'affichait de si loin que plus aucune
   étiquette ne tenait. */
/* En deçà, la zone visible couvre trop de terrain pour qu'Overpass réponde
   quelque chose d'exploitable. Le cadrage d'une recherche s'aligne sur ce
   seuil : poser la carte plus loin la laissait sans aucun lieu, et rien ne
   disait pourquoi. */
const ZOOM_MIN_CHARGEMENT = 13;

const ZOOM_ZONE_MAX = 15;
/* La borne basse n'est pas choisie : c'est le seuil en dessous duquel le
   chargement des lieux ne part pas. Les laisser diverger posait la carte sur
   Paris ou Marseille au zoom 12, où aucun POI n'était demandé — carte au bon
   endroit, écran vide, aucune explication. */
const ZOOM_ZONE_MIN = ZOOM_MIN_CHARGEMENT;

async function rechercheGeographique(q){
  const zone = await geocoderVille(q);
  if(!zone || !map) return false;
  /* Le nom de la zone ne doit pas rester un filtre plein texte sur les lieux :
     une fois la carte à Lille, garder « lille » comme requête faisait remonter
     « Gare Lille Flandres » au titre de correspondance explicite — donc des
     arrêts de transport, que cette passe range précisément par défaut.
     La destination a servi à déplacer la carte ; son travail est fini. */
  recherche = "";
  if($("#rech")) $("#rech").value = "";

  if(zone.emprise && map.fitBounds){
    map.fitBounds(zone.emprise, {maxZoom:ZOOM_ZONE_MAX, padding:[24,24], animate:true});
    if(map.getZoom() < ZOOM_ZONE_MIN) map.setZoom(ZOOM_ZONE_MIN);
  }else{
    map.flyTo([zone.lat, zone.lng], ZOOM_ZONE_MAX, {duration:.8});
  }

  /* Un seul point de référence : celui que la carte montre effectivement.
     Le géocodeur donne aussi un « point de la commune » — mairie ou centroïde
     — qui n'est pas le centre de l'emprise. À Bordeaux les deux sont à 2,9 km
     l'un de l'autre : les lieux étaient chargés autour du centre affiché, puis
     classés depuis le point géocodé, et TOUS tombaient hors du rayon de
     recherche. Zéro résultat sur une ville pleine de lieux. */
  const c = map.getCenter();
  const centre = c ? [c.lat, c.lng] : [zone.lat, zone.lng];
  rechercheGeo = {nom:q, lat:centre[0], lng:centre[1]};

  /* Redessiner tout de suite, sans attendre le réseau. Deux raisons :
     · la zone peut être déjà chargée — chargerZone ne repart alors pas, aucune
       donnée n'arrive, et rien ne déclenchait de rendu : les marqueurs de la
       vue précédente restaient posés sur la nouvelle ville ;
     · même quand elle charge, on veut voir immédiatement ce qu'on a déjà
       plutôt qu'un écran figé pendant la requête. */
  selectionAccueil = null;      // les recommandations se recalculent pour ici
  rendre();
  majAccueil();
  /* En mode Aide, changer de commune doit chercher les points d'aide de LÀ.
     Sans ça, on regardait Lille avec les adresses de son quartier de départ. */
  if(modeAide) chargerAide(centre[0], centre[1]);

  // les lieux de la nouvelle zone arrivent derrière : l'interface n'attend pas
  chargerZone(centre[0], centre[1]);
  majBoutons();
  return true;
}

/* ---- Favoris, côté écran ------------------------------------------------
   L'identité est anonyme : personne ne crée de compte. On ne la réclame donc
   qu'au premier favori — l'exploration reste possible sans rien signer.
   L'affichage est optimiste : le cœur bascule tout de suite, et se remet en
   place seulement si la base refuse. */
const favorisIds = new Set();
let favorisCharges = false;

/* Référence stable d'un lieu externe : sa source et son identifiant. */
function refFavori(l){
  if(!l) return "";
  if(l.dbId) return "";
  return (l.source || "osm")+":"+l.id;
}
function cleFavori(l){
  return l && l.dbId ? "pub:"+l.dbId : refFavori(l);
}
function estFavori(l){
  return favorisIds.has(cleFavori(l));
}

async function chargerFavoris(){
  if(favorisCharges) return;
  if(!(await connecter())) return;
  favorisCharges = true;
  const lignes = await Store.favoris();
  favorisIds.clear();
  lignes.forEach(f=>favorisIds.add(f.publication_id ? "pub:"+f.publication_id : f.lieu_ref));
  majCoeurs();
}

/* Bascule optimiste : l'écran répond immédiatement, la base suit. */
async function basculerFavori(l){
  const cle = cleFavori(l);
  if(!cle) return;
  const etait = favorisIds.has(cle);
  if(etait) favorisIds.delete(cle); else favorisIds.add(cle);
  majCoeurs();

  // l'identité anonyme n'est réclamée qu'ici, au moment où elle sert
  if(!(await connecter())){
    if(etait) favorisIds.add(cle); else favorisIds.delete(cle);
    majCoeurs();
    toast("Favoris indisponibles hors connexion");
    return;
  }
  const ok = etait ? await Store.retirerFavori(l) : await Store.ajouterFavori(l);
  if(!ok){
    if(etait) favorisIds.add(cle); else favorisIds.delete(cle);
    majCoeurs();
    toast("Impossible d’enregistrer ce favori");
    return;
  }
  majNavBas();
}

/* Remet tous les cœurs affichés en accord avec l'état courant. */
function majCoeurs(){
  document.querySelectorAll("[data-coeur]").forEach(b=>{
    const actif = favorisIds.has(b.dataset.coeur);
    b.classList.toggle("actif", actif);
    b.setAttribute("aria-pressed", String(actif));
    b.setAttribute("aria-label", actif ? "Retirer des favoris" : "Ajouter aux favoris");
  });
}

/* Le cœur lui-même : discret, et toujours au même endroit. */
function boutonCoeur(l){
  const cle = cleFavori(l);
  if(!cle) return "";
  const actif = favorisIds.has(cle);
  return '<button class="coeur'+(actif?" actif":"")+'" data-coeur="'+esc(cle)+'" '+
    'aria-pressed="'+actif+'" aria-label="'+(actif?"Retirer des favoris":"Ajouter aux favoris")+'">'+
    '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" '+
    'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M20.4 5.6a5 5 0 0 0-7.1 0L12 6.9l-1.3-1.3a5 5 0 1 0-7.1 7.1L12 21l8.4-8.3a5 5 0 0 0 0-7.1z"/>'+
    '</svg></button>';
}

/* Un seul branchement, délégué : les cœurs sont recréés à chaque rendu. */
document.addEventListener("click", (e)=>{
  const bouton = e.target.closest && e.target.closest("[data-coeur]");
  if(!bouton) return;
  e.preventDefault(); e.stopPropagation();
  const cle = bouton.dataset.coeur;
  const lieu = lieux.find(x=>cleFavori(x) === cle) || favorisEnMemoire.get(cle);
  if(lieu) basculerFavori(lieu);
});
const favorisEnMemoire = new Map();

/* ---- Ouvert / fermé : une seule source de vérité ------------------------
   Toute la question « est-ce que c'est ouvert » passe par availability.js.
   Aucun écran ne relit un opening_hours de son côté, sinon la carte et la
   fiche finissent par se contredire. */
function dispoDe(l, arrivee){
  const module = window.AutourAvailability;
  if(!module) return null;
  return module.getPlaceAvailability(l, instantCreneau().getTime(), arrivee);
}

/* Le libellé exact demandé par cas : « Ouvert • ferme à 23:30 », « Fermé •
   ouvre à 14:00 », « Fermé aujourd'hui », « Horaires non renseignés »… */
function badgeDispo(l){
  const d = dispoDe(l);
  if(!d) return "";
  const classe = d.status === "open" ? "ouvert"
    : d.status === "unknown" ? "inconnu" : "ferme";
  return '<span class="'+classe+'">'+esc(d.label)+'</span>';
}

/* Un lieu fermé reste sur la carte — il peut servir plus tard — mais il ne
   doit jamais se lire comme un lieu ouvert. */
function estFerme(l){
  const d = dispoDe(l);
  return !!d && (d.status === "closed" || d.status === "permanently_closed");
}

/* ---- Transport : de « c'est à 800 m » à « vous y êtes dans 22 min » ------
   Le classement est synchrone, le calcul d'itinéraire ne l'est pas. On
   garde donc un cache d'ETA lu instantanément par le classement, et on le
   remplit en tâche de fond pour les seuls résultats visibles — puis on
   reclasse. Tant qu'un ETA n'est pas connu, core.js retombe sur la marche :
   l'écran n'attend jamais le réseau. */
/* ---- Jalons de démarrage -------------------------------------------------
   Chaque étape est marquée pour être mesurable au lieu d'être ressentie.
   `AutourPerf.rapport()` rend le tableau des durées depuis l'ouverture. */
const PERF = {
  vus: new Set(),
  jalon(nom){
    // un jalon décrit un premier instant : le remarquer cent fois le noierait
    if(this.vus.has(nom)) return;
    this.vus.add(nom);
    try{ performance.mark("autour:"+nom); }catch(e){}
  },
  rapport(){
    const marques = performance.getEntriesByType("mark")
      .filter(m=>m.name.startsWith("autour:"));
    const fcp = performance.getEntriesByType("paint")
      .find(e=>e.name === "first-contentful-paint");
    const lignes = {};
    if(fcp) lignes["first-contentful-paint"] = Math.round(fcp.startTime);
    marques.forEach(m=>{ lignes[m.name.slice(7)] = Math.round(m.startTime); });
    return lignes;
  },
};
window.AutourPerf = PERF;

const TRANSIT = window.AutourTransit;
const etaParLieu = new Map();
let etaEnVol = null;

/* La clé inclut le quart d'heure : un ETA calculé il y a 40 min ne décrit
   plus le prochain passage. */
function cleEta(l, centre){
  return [l.id, Math.round(centre[0]*2000), Math.round(centre[1]*2000),
    Math.floor(Date.now()/900000)].join(",");
}

function etaConnu(l, centre){
  return etaParLieu.get(cleEta(l, centre)) || null;
}

/* Ne demande d'itinéraire que pour le haut de liste : c'est le seul endroit
   où l'ordre se joue, et chaque appel coûte une requête réseau. */
function prechargerEta(classement, centre, auRetour){
  if(!TRANSIT || !positionMoi) return;
  const cibles = classement.slice(0,12).filter(l=>!etaParLieu.has(cleEta(l, centre)));
  if(!cibles.length) return;
  if(etaEnVol) etaEnVol.abort();
  const ctrl = new AbortController();
  etaEnVol = ctrl;
  Promise.all(cibles.map(l=>
    TRANSIT.planTrip({
      from:centre, to:[Number(l.latitude ?? l.lat), Number(l.longitude ?? l.lng)],
      departAt:Date.now(), signal:ctrl.signal,
    }).then(eta=>{ etaParLieu.set(cleEta(l, centre), eta || null); })
      // un réseau muet dégrade la précision, pas l'écran. On mémorise
      // l'échec : sans cette trace, le reclassement redemanderait les mêmes
      // itinéraires et rappellerait majFeuille2 en boucle.
      .catch(()=>{ if(!ctrl.signal.aborted) etaParLieu.set(cleEta(l, centre), null); })
  )).then(()=>{
    if(ctrl.signal.aborted) return;
    etaEnVol = null;
    PERF.jalon("transport_ready");
    if(typeof auRetour === "function") auRetour();
  });
}

/* Le responsive décrit uniquement la présentation. Les requêtes et le
   classement ne dépendent jamais d'un userAgent ni d'un modèle d'appareil. */
function useResponsiveLayout(onChange){
  const medias = {
    mobile:window.matchMedia("(max-width: 767px)"),
    tablet:window.matchMedia("(min-width: 768px) and (max-width: 1099px)"),
    touch:window.matchMedia("(pointer: coarse)"),
  };
  const read = ()=>({
    isMobile:medias.mobile.matches,
    isTablet:medias.tablet.matches,
    isDesktop:!medias.mobile.matches && !medias.tablet.matches,
    isTouch:medias.touch.matches,
  });
  let value = read();
  const listeners = new Set();
  if(onChange) listeners.add(onChange);
  const notify = ()=>{
    value = read();
    listeners.forEach(listener=>listener(value));
  };
  Object.values(medias).forEach(media=>{
    if(media.addEventListener) media.addEventListener("change",notify);
    else media.addListener(notify);
  });
  if(onChange) onChange(value);
  return {
    get value(){ return value; },
    subscribe(listener){ listeners.add(listener); listener(value); return ()=>listeners.delete(listener); },
    destroy(){
      Object.values(medias).forEach(media=>{
        if(media.removeEventListener) media.removeEventListener("change",notify);
        else media.removeListener(notify);
      });
      listeners.clear();
    },
  };
}

let responsiveLayoutState = {isMobile:false,isTablet:false,isDesktop:true,isTouch:false};
const responsiveLayout = useResponsiveLayout(layout=>{
  responsiveLayoutState = layout;
  document.body.dataset.layout = layout.isMobile ? "mobile" : layout.isTablet ? "tablet" : "desktop";
  document.body.classList.toggle("touch",layout.isTouch);
  requestAnimationFrame(()=>{
    synchroniserHauteurFeuille();
    if(map) map.invalidateSize({pan:false});
  });
});

function synchroniserHauteurFeuille(){
  const feuille = document.getElementById("feuilleBesoins");
  const visible = feuille && !feuille.hidden && !responsiveLayoutState.isDesktop;
  const hauteur = visible ? Math.round(feuille.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty("--sheet-visible-height",hauteur+"px");
}

const NOMS_COUCHES = Object.freeze({
  mainSheet:"mainSheet",
  placeDetails:"placeDetails",
  publishModal:"publishModal",
  confirmationDialog:"confirmationDialog",
  searchOverlay:"searchOverlay",
});

/* Une seule couche principale reste interactive. La sheet peut être suspendue
   derrière une fiche, mais elle est alors hidden et restaurée à la fermeture. */
const layerManager = {
  stack:[],
  activate(name){
    const confirmation = name === NOMS_COUCHES.confirmationDialog;
    if(!confirmation) this.stack = this.stack.filter(x=>x===NOMS_COUCHES.confirmationDialog);
    if(!this.stack.includes(name)) this.stack.push(name);
    const sheet = document.getElementById("feuilleBesoins");
    if(name !== NOMS_COUCHES.mainSheet && sheet && !sheet.hidden){
      sheet.dataset.suspended = "true";
      sheet.hidden = true;
    }
    if(name !== NOMS_COUCHES.searchOverlay){
      const suggestions = document.getElementById("suggestions");
      if(suggestions) suggestions.hidden = true;
    }
    this.sync();
  },
  deactivate(name){
    this.stack = this.stack.filter(x=>x!==name);
    const sheet = document.getElementById("feuilleBesoins");
    const autrePrincipale = this.stack.some(x=>x!==NOMS_COUCHES.confirmationDialog);
    if(!autrePrincipale && sheet && sheet.dataset.suspended === "true" && feuilleNiveau !== null && !modePose && !modeNav){
      delete sheet.dataset.suspended;
      sheet.hidden = false;
      this.stack.push(NOMS_COUCHES.mainSheet);
    }
    this.sync();
  },
  top(){ return this.stack[this.stack.length-1] || null; },
  sync(){
    document.body.classList.toggle("ui-modal-open",this.stack.some(x=>
      [NOMS_COUCHES.placeDetails,NOMS_COUCHES.publishModal,NOMS_COUCHES.confirmationDialog].includes(x)));
    document.body.classList.toggle("sheet-open",this.stack.includes(NOMS_COUCHES.mainSheet));
    requestAnimationFrame(synchroniserHauteurFeuille);
  },
};

if(window.ResizeObserver){
  new ResizeObserver(()=>synchroniserHauteurFeuille()).observe(document.getElementById("feuilleBesoins"));
}

function affinerCategorie(cat, nom){
  if(!nom) return cat;
  if(classifyPlace({cat, title:nom}).includes("cinema")) return "cinema";
  if(cat === "resto" || cat === "fastfood" || cat === "cafe"){
    if(CHAINES_CAFE.test(nom))     return "cafe";
    if(CHAINES_FASTFOOD.test(nom)) return "fastfood";

/* Nombres écrits en toutes lettres : « j'ai quinze euros » doit marcher comme
   « j'ai 15 euros ». La table est construite une seule fois au chargement. */
const MOTS_NOMBRES = (()=>{
  const u = ["","un","deux","trois","quatre","cinq","six","sept","huit","neuf"];
  const p = {0:"zero",1:"un",2:"deux",3:"trois",4:"quatre",5:"cinq",6:"six",7:"sept",
             8:"huit",9:"neuf",10:"dix",11:"onze",12:"douze",13:"treize",14:"quatorze",
             15:"quinze",16:"seize"};
  const m = new Map();
  for(const [n,mot] of Object.entries(p)) m.set(mot, Number(n));
  m.set("une",1);
  for(let i=7;i<=9;i++) m.set("dix "+u[i], 10+i);                    // dix-sept…
  const diz = {20:"vingt",30:"trente",40:"quarante",50:"cinquante",60:"soixante"};
  for(const [d,mot] of Object.entries(diz)){
    m.set(mot, Number(d));
    m.set(mot+" et un", Number(d)+1);
    for(let i=2;i<=9;i++) m.set(mot+" "+u[i], Number(d)+i);
  }
  m.set("soixante dix",70); m.set("soixante et onze",71);
  for(let i=2;i<=9;i++) m.set("soixante "+(p[10+i]||("dix "+u[i])), 70+i);
  m.set("quatre vingt",80); m.set("quatre vingts",80);
  for(let i=1;i<=9;i++) m.set("quatre vingt "+u[i], 80+i);
  m.set("quatre vingt dix",90);
  for(let i=1;i<=9;i++) m.set("quatre vingt "+(p[10+i]||("dix "+u[i])), 90+i);
  m.set("cent",100);
  return m;
})();

   de reparcourir toutes les listes à chaque frappe. */

  for(const [id,mots] of Object.entries(CUISINES))
    m.set(sansAccents(id), {cuisine:mots});
  for(const [mot,val] of Object.entries(CUISINES))

/* Repère un montant, en chiffres ou en lettres. */
function montantEuros(t){
  const chiffres = /(\d{1,3})\s*(?:e\b|eu\b|euros?|€)/.exec(t);
  if(chiffres) return Number(chiffres[1]);
  const avant = /([a-z ]{3,28})\s*(?:euros?|balles?|€)/.exec(t);
  if(!avant) return null;
  const mots = avant[1].trim().split(/\s+/);
  // on essaie la plus longue suite de mots qui forme un nombre connu
  for(let d=Math.max(0,mots.length-4); d<mots.length; d++){
    const cle = mots.slice(d).join(" ");
    if(MOTS_NOMBRES.has(cle)) return MOTS_NOMBRES.get(cle);
  }
  return null;
}

function cuisineRecherchee(q){
  const t = sansAccents(q).trim();
  if(t.length < 3) return null;
  const direct = INDEX_MOTS.get(t);          // correspondance exacte, immédiate
  if(direct && direct.cuisine) return direct.cuisine;
  for(const [mot,val] of Object.entries(CUISINES)){
    const m = sansAccents(mot);
    if(t.includes(m)) return val;
  }
  return null;
}

/* Rend « bar », « Bars » et « boire un verre » équivalents. */
function categorieRecherchee(q){
  const t = sansAccents(q).trim();
  if(t.length < 3) return null;
  const direct = INDEX_MOTS.get(t);          // correspondance exacte, immédiate
  if(direct && direct.cat) return direct.cat;
  for(const [id,c] of Object.entries(CATS)){
    if(sansAccents(c.label).includes(t)) return id;
  }
  for(const [id,mots] of Object.entries(SYNONYMES)){
    if(mots.some(m=>{ const s=sansAccents(m); return s.includes(t) || t.includes(s); })) return id;
  }
  return null;
}

/* ---- « Est-ce un mot de l'application, ou un nom de lieu ? » ---------------
   categorieRecherchee() cherche des SOUS-CHAÎNES, ce qui est juste pour une
   recherche mais faux pour cette question-là : « Bar-le-Duc » contient « bar »
   sans être un bar, et la commune n'était donc jamais géocodée.
   Ici la comparaison est EXACTE, sur le vocabulaire réellement défini —
   catégories, cuisines, besoins. Aucune ville n'y figure : c'est le géocodeur
   qui sait ce qui est un lieu, pas une liste écrite à la main. */
const MOTS_BESOINS = (()=>{
  const m = new Set();
  BESOINS.forEach(b=>{
    m.add(sansAccents(b.id));
    m.add(sansAccents(b.label));
    (b.sous||[]).forEach(s=>m.add(sansAccents(s.label)));
  });
  return m;
})();

function estTermeMetier(texte){
  const t = sansAccents(String(texte||"")).trim();
  if(!t) return false;
  return INDEX_MOTS.has(t) || MOTS_BESOINS.has(t);
}

let pSupabase = null;
let pConnexion = null;
function chargerSupabase(){
  if(window.supabase) return Promise.resolve(true);
  if(pSupabase) return pSupabase;
  pSupabase = new Promise(ok=>{
    const el = document.createElement("script");
    el.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
    el.onload = ()=>ok(true);
    el.onerror = ()=>{ journal.warn("Supabase indisponible."); ok(false); };
    document.head.appendChild(el);
  });
  return pSupabase;
}

async function connecter(){
  if(sb && moiId) return sb;
  if(pConnexion) return pConnexion;
  pConnexion = (async()=>{
    if(!(await chargerSupabase())) return null;
    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_CLE);
      let { data:{ session } } = await sb.auth.getSession();
      if(!session){
        const { data, error } = await sb.auth.signInAnonymously();
        if(error) throw error;
        session = data.session;
      }
      moiId = session && session.user ? session.user.id : null;
      return sb;
    }catch(e){
      console.error("Identité anonyme indisponible :", e.message || e);
      sb = null;
      return null;
    }
  })();
  const resultat = await pConnexion;
  if(!resultat) pConnexion = null;
  return resultat;
}

function versLieu(p){

    verifie: p.verifie, mien: !!(moiId && p.auteur === moiId),

    debutLe: p.debut_le ? new Date(p.debut_le).getTime() : null,
    finLe: p.fin_le ? new Date(p.fin_le).getTime() : null,
    isTemporary:true, url:p.url || "", image:p.image_url || p.image || "",
    /* Une annulation était enregistrée en base, écrite dans le canal, et
       perdue ici : la carte et la fiche affichaient l'événement comme s'il
       avait lieu. Quelqu'un se déplaçait pour rien. */
    annule: !!p.annule
  }, "autour");

/* Passe par une fonction en base plutôt que par un select * : seules les
   colonnes affichées reviennent, la zone est filtrée côté serveur et les
   événements terminés sont écartés avant d'être transmis. */
async function chargerPublications(lat,lng){
  if(!sb) return [];
  const b = bornesVisibles() ||
    { s:lat-0.06, n:lat+0.06, o:lng-0.06, e:lng+0.06 };
  const { data, error } = await sb.rpc("publications_proches", {
    p_sud:Number(b.s), p_ouest:Number(b.o),
    p_nord:Number(b.n), p_est:Number(b.e), p_limite:120
  });
  if(error){ console.error("Lecture des publications :", error.message); return []; }
  return (data||[]).map(versLieu);
}

const Store = {

     auteur — c'est ce chemin que la RLS du stockage vérifie. Un échec d'envoi
     ne doit jamais empêcher la publication : l'événement compte plus que
     son image. */
  async televerserImage(fichier){
    if(!sb || !fichier || !moiId) return "";
    const extension = (fichier.type.split("/")[1] || "jpg").replace("jpeg","jpg");
    const chemin = moiId+"/"+Date.now()+"."+extension;
    const { error } = await sb.storage.from("evenements")
      .upload(chemin, fichier, {cacheControl:"3600", upsert:false});
    if(error){ console.error("Image refusée :", error.message); return ""; }
    const { data } = sb.storage.from("evenements").getPublicUrl(chemin);
    return (data && data.publicUrl) || "";
  },

  async publier(l){
    if(!sb) return null;
    const { data, error } = await sb.from("publications").insert({
      cat:l.cat, titre:l.titre, adresse:l.adresse, cp:l.cp, quand:l.quand,
      gratuit:l.gratuit, prix:l.prix, places:l.places,

const SERVEURS = [
  "https://overpass.kumi.systems/api/interpreter",   // le plus rapide et le moins saturé
  "https://overpass-api.de/api/interpreter",
  "https://overpass.osm.ch/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
];

async function overpass(q, msMax, signal){
  const simule = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) &&
    new URLSearchParams(location.search).get("simulateOverpassFailure") === "1";
  if(simule){
    journal.warn("Overpass : panne simulée pour le test local");
    return null;
  }
  for(const url of SERVEURS){
    if(signal && signal.aborted) return null;
    try{
      const stop = new AbortController();
      const t = setTimeout(()=>stop.abort(), msMax||14000);
      // une nouvelle zone demandée annule vraiment la précédente : avant, la
      // requête partait quand même et seul son résultat était jeté
      if(signal) signal.addEventListener("abort", ()=>stop.abort(), {once:true});
      const r = await fetch(url,{method:"POST", signal:stop.signal,
        body:"data="+encodeURIComponent(q),
        headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      clearTimeout(t);
      if(!r.ok){ journal.warn("Overpass", r.status, url); continue; }
      const j = await r.json();
      if(j && j.elements) return j.elements;
    }catch(e){ journal.warn("Overpass injoignable :", url, e.name||e); }
  }
  console.error("Overpass : aucun serveur n’a répondu");
  return null;
}

/* ---------- géométrie de la ville ---------- */
async function geometrieVille(lat,lng){
  // requête légère : les serveurs publics refusent les grosses demandes
  const q1 = `[out:json][timeout:20];
(
way(around:800,${lat},${lng})[highway~"^(motorway|trunk|primary|secondary|tertiary|residential|unclassified|living_street|pedestrian)$"];
way(around:800,${lat},${lng})[leisure~"^(park|garden|pitch)$"];
way(around:800,${lat},${lng})[landuse~"^(grass|forest|cemetery)$"];
way(around:800,${lat},${lng})[natural=water];
);
out geom;`;
  let els = await overpass(q1, 14000);
  if(els && els.length) return els;

  // seconde chance, encore plus petit
  const q2 = `[out:json][timeout:15];
way(around:450,${lat},${lng})[highway~"^(primary|secondary|tertiary|residential|pedestrian)$"];
out geom;`;
  return await overpass(q2, 10000);
}

/* ---------- lieux remarquables ---------- */
/* Ce qu'on demande à l'ouverture : de quoi manger, sortir et se repérer.
   Les écoles, les administrations, les toilettes et les bornes de recharge
   ne sont jamais proposées d'office — les demander au démarrage allongeait
   la requête sans rien afficher de plus. Elles arrivent quand on ouvre le
   besoin correspondant. */
const CATS_DEPART = new Set(["resto","fastfood","cafe","marche","bar","cinema",
  "spectacle","concert","friperie","commerce","biblio","musee","parc","metro","bus"]);

async function vraisLieux(lat,lng,bornes,opts){
  const o = opts || {};
  // Une sous-requête par CLÉ (avec regex sur les valeurs) au lieu d'une par
  // couple clé/valeur : ~5 lignes au lieu de 40. Les serveurs publics saturaient
  // sur l'ancienne version, d'où les "lieux d'exemple" affichés à la place.
  const garder = o.cats ? new Set(o.cats) : (o.tout ? null : CATS_DEPART);
  const parCle = {};
  REQUETES.forEach(([k,v,cat])=>{
    if(garder && !garder.has(cat)) return;
    (parCle[k] = parCle[k] || []).push(v);
  });
  if(!Object.keys(parCle).length) return [];
  // On interroge la zone effectivement affichée plutôt qu'un rayon fixe :
  // en vue serrée on ramène beaucoup moins, en vue large on couvre vraiment
  // ce que la personne regarde. Bornée pour ne pas demander une ville entière.
  const zone = bornes ? `(${bornes.s},${bornes.o},${bornes.n},${bornes.e})`
                      : `(around:1500,${lat},${lng})`;
  const bloc = Object.entries(parCle).map(([k,vs])=>
    `nwr${zone}["${k}"~"^(${vs.join("|")})$"];`).join("");
  // 25 s : mieux vaut attendre que retomber sur des lieux inventés
  const els = await overpass(`[out:json][timeout:25];(${bloc});out center 300;`, 25000, o.signal);
  if(!els){ definirEtatRecherche("overpass",SEARCH_STATES.OVERPASS_UNAVAILABLE); return []; }
  definirEtatRecherche("overpass",SEARCH_STATES.SUCCESS);
  return els.map(e=>{
    const t=e.tags||{}, p=e.center||e;
    if(!p.lat||!p.lon) return null;
    const regle = REQUETES.find(([k,v])=>t[k]===v);
    if(!regle) return null;
    const cat = affinerCategorie(regle[2], t.name);
    return normaliserItem({
      id:"osm"+e.type+e.id, cat,
      titre: t.name || CATS[cat].label,
      description:t.description || t.note || "", tags:t,
      type:t.amenity || t.leisure || t.tourism || t.office || "",
      sansNom: !t.name,                      // « un résultat sans nom exploitable »
      adresse: [t["addr:housenumber"],t["addr:street"]].filter(Boolean).join(" ") || (t.name||CATS[cat].label),
      cp: [t["addr:postcode"],t["addr:city"]].filter(Boolean).join(" ") || commune,
      quand: t.opening_hours || "Voir sur place",
      cuisine: t.cuisine || "",              // turkish, african, pizza…
      tel: t.phone || t["contact:phone"] || "",
      pmr: t.wheelchair === "yes" ? true : (t.wheelchair === "no" ? false : undefined),
      service: preciserService(t.name),      // Mission locale ≠ France Travail
      solidaire: estSolidaire(t.name, regle[1]==="charity" || /^(social_facility|social_centre)$/.test(regle[1])
                              || regle[0] === "social_facility"),
      gratuit: t.fee!=="yes", prix: t.fee==="yes"?6:0,
      places:null, qr:false, par:"OpenStreetMap", lat:p.lat, lng:p.lon
    }, "openstreetmap");
  }).filter(Boolean);
}

/* Événements locaux publiés sur les agendas officiels OpenAgenda. La clé est
   une clé publique de lecture ; aucun événement n'est inventé en repli. */
const CLE_OPENAGENDA = "oa_pk_iWmzFaEujSWtgBdvWCdXQnRtgtrqkpokQbkRGVUrscALWleiwQesAucPIQNUGLjS";

function catOpenAgenda(evt){
  const mots = sansAccents((evt.title&&evt.title.fr||"")+" "+((evt.keywords&&evt.keywords.fr)||[]).join(" "));
  if(/screening|movie|film|projection|seance cinema/.test(mots)) return "event";
  if(/collecte|don /.test(mots)) return "collecte";
  if(/lecture|bibliotheque|livre/.test(mots)) return "biblio";
  if(/sport|foot|match|tournoi/.test(mots)) return "sport";
  if(/concert|scene|musique|spectacle/.test(mots)) return "concert";
  if(/marche|brocante|vide-grenier/.test(mots)) return "marche";
  if(/repas|cantine|cuisine/.test(mots)) return "food";
  if(/studio|enregistrement/.test(mots)) return "studio";
  return "event";
}

async function evenementsOpenAgenda(lat,lng){
  if(!CLE_OPENAGENDA) return null;
  try{
    // La lecture transverse /v2/events est expérimentale et n'est pas ouverte
    // à cette clé. On découvre donc les agendas officiels de la commune, puis
    // on lit leurs événements publiés avec les routes publiques documentées.
    const ville = await nomCommune(lat,lng);
    const rechercheAgendas = new URLSearchParams({
      key:CLE_OPENAGENDA, search:ville, size:"8", official:"1"
    });
    const rAgendas = await fetch("https://api.openagenda.com/v2/agendas?"+rechercheAgendas.toString());
    if(!rAgendas.ok){ console.error("OpenAgenda agendas : réponse HTTP", rAgendas.status); return null; }
    const agendas = ((await rAgendas.json()).agendas||[]).slice(0,8);
    const segments = await Promise.allSettled(agendas.map(async agenda=>{
      const params = new URLSearchParams({
        key:CLE_OPENAGENDA, size:"30", detailed:"1"
      });
      params.append("relative[]","current");
      params.append("relative[]","upcoming");
      const r = await fetch("https://api.openagenda.com/v2/agendas/"+agenda.uid+"/events?"+params.toString());
      if(!r.ok) throw new Error("agenda "+agenda.uid+" : HTTP "+r.status);
      return (await r.json()).events || [];
    }));
    const uniques = new Map();
    segments.forEach(segment=>{
      if(segment.status !== "fulfilled") return;
      segment.value.forEach(evt=>uniques.set(evt.uid,evt));
    });
    const bruts = [...uniques.values()];
    journal.info("OpenAgenda:", bruts.length, "événement(s) bruts depuis", agendas.length, "agenda(s)");
    const classes = bruts.map(evt=>{
      const loc = evt.location || {};
      if(loc.latitude==null || loc.longitude==null) return null;
      if(distanceM(lat,lng,Number(loc.latitude),Number(loc.longitude)) > 8000) return null;
      return normaliserItem({
        id:"oa"+evt.uid, cat:catOpenAgenda(evt),
        titre:(evt.title && (evt.title.fr||Object.values(evt.title)[0])) || "Événement",
        description:(evt.description && (evt.description.fr||Object.values(evt.description)[0])) || "",
        keywords:(evt.keywords && (evt.keywords.fr||Object.values(evt.keywords)[0])) || [],
        eventCategory:(evt.keywords && (evt.keywords.fr||[]).join(" ")) || "",
        adresse: loc.name || loc.address || commune,
        cp: [loc.postalCode, loc.city].filter(Boolean).join(" ") || commune,
        quand: (()=>{
          const t = evt.nextTiming || evt.firstTiming || (evt.timings||[])[0];
          if(!t || !t.begin) return "Voir sur place";
          return new Date(t.begin).toLocaleString("fr-FR",
            {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
        })(),
        debutLe: (()=>{
          const t = evt.nextTiming || evt.firstTiming || (evt.timings||[])[0];
          return t && t.begin ? new Date(t.begin).getTime() : null;
        })(),
        // fin réelle, pour ne plus afficher un événement d'hier
        finLe: (()=>{
          const t = evt.nextTiming || evt.firstTiming || (evt.timings||[])[0];
          if(!t) return null;
          const f = t.end || t.begin;
          return f ? new Date(f).getTime() + (t.end ? 0 : 3*3600*1000) : null;
        })(),
        gratuit: !(evt.registration && evt.registration.price), prix:0,
        places:null, qr:false, par:"OpenAgenda",
        isTemporary:true,
        url:evt.canonicalUrl || evt.originAgenda && evt.originAgenda.url || "",
        image:evt.image ? (evt.image.base || "")+(evt.image.filename || "") : "",
        lat:loc.latitude, lng:loc.longitude
      }, "openagenda");
    }).filter(Boolean);
    journaliserPipeline("OpenAgenda", bruts.length, classes, classes);
    return classes;
  }catch(e){ console.error("OpenAgenda: échec de la requête", e); return null; }
}
